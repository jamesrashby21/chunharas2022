,"default":"25"},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced locations items can occupy (around a circle).","default":"8"},{"name":"radius","type":"integer","desc":"Radius (px) of the circle the items are arranged on.","default":"160"},{"name":"item_size","type":"integer","desc":"Diameter (px) of each memory item.","default":"90"},{"name":"placeholder_border","type":"string","desc":"CSS border drawn on every location for image/text items (\"none\" = invisible). Drawn by default because the task cues locations. Color items get a thin circular outline instead and ignore this.","default":"\"2px solid #ccc\""},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"position_angle_offset","type":"float","desc":"Rotate the whole placeholder ring by this many degrees.","default":"0"},{"name":"color_rotation_deg","type":"integer []","desc":"Per-item hue rotation (deg) in CIELAB, applied to image items only, one entry per memory item. Empty (default) = images shown unmodified.","default":"[]"},{"name":"display_time","type":"integer","desc":"How long (ms) the memory array is shown. 0 skips the array (test-only), unless sequential.","default":"500"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms) between array offset and test onset. With mask_time > 0 it starts when the mask comes off, and still runs in full.","default":"800"},{"name":"retrocue_time","type":"integer","desc":"If > 0, after the delay ring the to-be-probed location (`cue_color`/`cue_thickness`) for this long before the test appears. The ring stays up through the test unless cue_test_location replaces it. 0 = off.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}).","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each memory item covered by the `noise_type` degradation (a transparent overlay). The options and the grayscale preview are never degraded.","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start (click or onset) to the pre-cue, or to the array if there is none.","default":"500"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"sequential","type":"boolean","desc":"Present the memory array one item at a time (vs. all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"precue_time","type":"integer","desc":"If > 0, ring the to-be-probed location (plus any `cue_items`) for this long before the array. The probe-location ring comes off at array onset. Skipped when do_test is false (no probe to cue).","default":"0"},{"name":"preview_duration","type":"integer","desc":"If > 0, show the probed item in grayscale at its location for this long before the options appear. Color and text items become a plain gray shape, so the preview gives away location only.","default":"0"},{"name":"do_test","type":"boolean","desc":"If false, just encode + delay then end (no test); for study-only blocks.","default":"true"},{"name":"cue_items","type":"integer []","desc":"Item indices (0..set_size-1) to draw an encoding cue ring around.","default":"[]"},{"name":"cue_color","type":"string","desc":"Color of the encoding cue ring (also used by the retro-cue highlight).","default":"\"red\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the encoding cue ring (also used by the retro-cue highlight).","default":"4"},{"name":"cue_test_location","type":"boolean","desc":"Ring the probed location in black at test. Skipped when preview_duration > 0, since the preview already marks the location.","default":"true"},{"name":"which_test","type":"integer","desc":"Which item (0..set_size-1; serial position when sequential) is probed.","default":"0"},{"name":"choices_per_test","type":"integer","desc":"Number of options K when they are generated (min 2). Ignored when test_options or test_color_rotation_deg supply the options.","default":"2"},{"name":"test_options","type":"object","desc":"Explicit option specs (colors/degrees/images/text), in canonical order, including the correct one. If omitted, options are generated (color items only). With shuffle_options false they are shown in this order. (Declared OBJECT so jsPsych does not warn about an array in a STRING parameter on every trial.)","default":"null"},{"name":"correct_option","type":"integer","desc":"Index (into the canonical option list) of the correct option, or null to infer it: the option whose resolved value equals the probed item's (test_options), or the rotation equal to the probed item's study rotation (test_color_rotation_deg).","default":"null"},{"name":"test_color_rotation_deg","type":"integer []","desc":"Build the options by hue-rotating the probed image by these degrees, one option per entry. The correct option is the rotation matching the probed item's study rotation. Overrides test_options when set.","default":"[]"},{"name":"option_layout","type":"string","desc":"Layout of the options. \"center\" (default) puts them on a small ring around fixation, inside the box. \"row\", \"grid\", and \"circle\" put them in a strip below the stage, reserved from the start so the box does not move when they appear.","default":"\"center\""},{"name":"option_size","type":"integer","desc":"Diameter (px) of each option (null = use item_size). The \"center\" layout shrinks options (to no less than 28 px) when they would not otherwise fit inside the ring.","default":"null"},{"name":"option_gap","type":"integer","desc":"\"center\" layout: min gap (px) between adjacent options (they otherwise just touch).","default":"0"},{"name":"option_margin","type":"integer","desc":"\"center\" layout: min clearance (px) between an option's outer edge and the placeholder ring.","default":"12"},{"name":"shuffle_options","type":"boolean","desc":"Randomize the display order of the options. If false, options keep their listed order; generated options list the target first, so it is always in display slot 0 (a one-time console note says so).","default":"true"},{"name":"response_ui","type":"string","desc":"How responses are collected: \"mouse\" (click an option) or \"keyboard\".","default":"\"mouse\""},{"name":"choice_keys","type":"keys []","desc":"response_ui \"keyboard\": keys mapped to options by screen position in reading order (top row first, left to right within a row), whatever the option_layout. With two options side by side, choice_keys[0] is the left one.","default":"[\"ArrowLeft\",\"ArrowRight\"]"},{"name":"collect_confidence","type":"boolean","desc":"After the choice, pop up an inline confidence picker anchored to the chosen option (task box stays visible). Stores `confidence` 1..N, N = confidence_labels.length. Its x button un-commits the choice so the participant can choose again.","default":"false"},{"name":"confidence_labels","type":"string []","desc":"Word labels (low -> high) for the confidence picker.","default":"[\"Guess\",\"Maybe\",\"Probably\",\"Certain\"]"},{"name":"confidence_colors","type":"string []","desc":"CSS colors (low -> high) for the confidence buttons.","default":"[\"#e74c3c\",\"#e67e22\",\"#9acd32\",\"#2ecc71\"]"},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the display (e.g. the question).","default":"null"},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"#dddddd\""},{"name":"feedback","type":"boolean","desc":"Briefly outline the chosen (and correct) option after responding.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct response.","default":"true"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"},{"name":"record_mouse","type":"boolean","desc":"Record the whole-trial mouse trajectory (cursor path to the chosen option).","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between mouse samples during encoding/delay (0 = every event).","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between mouse samples once the options appear (0 = every event).","default":"0"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from options onset to the choice (KeyDown for keyboard). The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the committing click (response_ui \"mouse\"). \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable, and for keyboard responses."},{"name":"key_hold_duration","type":"integer","desc":"How long (ms) the response key was held down: KeyDown -> KeyUp (response_ui \"keyboard\"). \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable (key never released, window blurred), and for mouse responses."},{"name":"key_presses","type":"object []","desc":"Every key pressed during the response window: {key, t (ms from response onset), duration}. `duration` is null for a key that was still held when the window closed (it never produced a release, but still counts for the multi-key exclusion)."},{"name":"multiple_keys_pressed","type":"boolean","desc":"True if a key other than the recorded response was also pressed (the standard RD exclusion criterion)."},{"name":"chosen_option","type":"integer","desc":"Canonical index (into test_options) of the chosen option."},{"name":"chosen_position","type":"integer","desc":"Screen position of the chosen option in reading order (0 = top-left; with two side-by-side options, 0 = left)."},{"name":"chosen_spec","type":"string","desc":"The spec of the chosen option."},{"name":"correct","type":"boolean","desc":"Whether the choice was correct (null if correctness is unknown)."},{"name":"correct_option","type":"integer","desc":"Canonical index of the correct option (null if unknown)."},{"name":"response","type":"string","desc":"The pressed key, when response_ui is \"keyboard\"."},{"name":"confidence","type":"integer","desc":"Confidence rating 1..N where N = confidence_labels.length (default 4: 1 = Guess ... 4 = Certain), or null when not collected."},{"name":"rt_confidence","type":"integer","desc":"Response time (ms) from the choice to the confidence rating (collect_confidence only; else null)."},{"name":"confidence_mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the confidence-rating click, a second response separate from the choice (collect_confidence only; else null). The rating picker is click-only, so there is no keyboard counterpart."},{"name":"positions","type":"integer []","desc":"Placeholder index of each presented item."},{"name":"stimuli","type":"string []","desc":"The studied item specs, as given/generated (as strings)."},{"name":"item_shape","type":"string","desc":"Item shape used (\"disk\" or \"square\")."},{"name":"test_options","type":"string []","desc":"The option specs, in canonical order (as strings)."},{"name":"option_order","type":"integer []","desc":"Display order (canonical option index at each display position)."},{"name":"which_test","type":"integer","desc":"Index of the probed item (after clamping to 0..set_size-1)."},{"name":"set_size","type":"integer","desc":"Number of items in the memory array."},{"name":"actual_stim_duration","type":"integer","desc":"Measured time (ms) from array onset to hide, via performance.now() at the paint and clear calls (null on the invalid-config path)."},{"name":"stimuli_shown","type":"object []","desc":"One entry per study item: placeholder index (`position`), centre (`x`,`y`, px in the stage frame), `rotation`, and its value (`src`, `text`, or `value` for colors)."},{"name":"mouse_trajectory","type":"object []","desc":"Mouse-trajectory samples (only when record_mouse): rows of [t, x, y, value], value = nearest option index during the response."},{"name":"mouse_trajectory_columns","type":"string []","desc":"Column names for each mouse_trajectory row (only when record_mouse)."},{"name":"mouse_response_start_index","type":"integer","desc":"Index of the first response-phase mouse sample (only when record_mouse)."},{"name":"mouse_phase_onsets","type":"object","desc":"Only when record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at the fixation click, or at trial start when click_to_start is false). encoding: 0, tracking start, which comes before delay_start and any pre-cue; array: the memory array's onset (absent when display_time is 0 and not sequential, since no array is shown); mask: the mask's onset, which is the array's offset (only on trials that show a mask); delay: the blank retention interval begins, at the array's offset or, after a mask, at the mask's offset; report: the response options appear (any retro-cue falls between delay and report); confidence: the confidence popup opens (collect_confidence only)."},{"name":"mouse_zoom","type":"float","desc":"Auto-zoom scale of the box, for unscaling mouse coordinates (only when record_mouse)."},{"name":"mouse_geometry","type":"object","desc":"Layout in the mouse-trajectory frame (only when record_mouse): each option's box (index/value/correct/x/y/w/h) and target_option (the correct one's centre). `confidence_options` holds the rating-button boxes (value 1..N) when collect_confidence is on, else null."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-wm-pairs.js","global":"jsPsychWmPairs","name":"wm-pairs","desc":"Working memory for concentric two-color objects. Each memory item is one object with an outer disc color and a smaller inner disc color drawn on top of it.","params":[{"name":"pair_colors","type":"string []","desc":"The objects, as an array of [outer, inner] color pairs. Each color may be a number (degree on the color wheel), a numeric string (\"120\" is the same degree, as everywhere a color is expected), a CSS color string (\"rgb(...)\", \"#0f0\"), or a \"lab(L,a,b)\" string, e.g. [[0,180],[90,270],[45,315]] for 3 objects. If empty, `set_size` random wheel-color pairs are generated.","default":"[]"},{"name":"set_size","type":"integer","desc":"Number of objects to generate when `pair_colors` is empty (at least 1).","default":"3"},{"name":"min_color_distance","type":"integer","desc":"Min separation (deg) between the two colors of a generated pair, and between generated distractor swatches and the target / each other (values below 1 count as 1 for distractors, so none duplicates the target).","default":"20"},{"name":"color_wheel","type":"object","desc":"Color wheel for degree lookups (defaults to window.BradyColorWheel).","default":"null"},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced locations objects can occupy (0 = use set_size).","default":"0"},{"name":"radius","type":"integer","desc":"Radius (px) of the circle the objects are arranged on.","default":"160"},{"name":"item_size","type":"integer","desc":"Diameter (px) of each object's outer disc.","default":"110"},{"name":"inner_size_ratio","type":"float","desc":"Inner disc diameter as a fraction of `item_size` (default 60/110).","default":"0.5454545454545454"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"which_test","type":"object","desc":"Which object is probed: an item index (0..set_size-1), or the 2-element array [item_index, inner_or_outer] with 0 = outer, 1 = inner. Out-of-range indices are clamped. Declared OBJECT, not INT, because jsPsych 8 coerces a non-array INT parameter to a number and would turn the array form into NaN.","default":"0"},{"name":"probe_feature","type":"string","desc":"Which sub-feature is probed: \"outer\" or \"inner\" (ignored if which_test is an array).","default":"\"outer\""},{"name":"test_color_options","type":"string []","desc":"The clickable color swatches shown at test, as wheel degrees / CSS / \"lab(...)\". Should include the probed sub-feature's true color; a swatch counts as correct when its resolved CSS string equals the target's. Shown in the order given (not shuffled). If empty, `num_test_options` swatches are generated (the true color + distractors) and shuffled.","default":"[]"},{"name":"num_test_options","type":"integer","desc":"How many swatches to generate when `test_color_options` is empty (min 2).","default":"4"},{"name":"option_size","type":"integer","desc":"Diameter (px) of each test-option swatch.","default":"60"},{"name":"display_time","type":"integer","desc":"How long (ms) the objects are shown (0 = not shown, unless sequential).","default":"500"},{"name":"sequential","type":"boolean","desc":"Present the memory items one at a time in their placeholders (instead of all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms) between object offset and the probe. With mask_time > 0 it starts when the mask comes off, and still runs in full.","default":"800"},{"name":"precue_time","type":"integer","desc":"If > 0, ring the probed sub-feature (`cue_color`/`cue_thickness`) for this long right after the start, then wait delay_start before the array. 0 = off.","default":"0"},{"name":"retrocue_time","type":"integer","desc":"Retro-cue duration (ms). When > 0, after the retention delay the probed sub-feature is ringed (`cue_color`/`cue_thickness`) for this long before the swatches appear. With the default cue color and thickness this is the same ring used at the probe. 0 = no retro-cue.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}).","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each object (outer + inner disc) covered by the `noise_type` degradation (a transparent overlay; removed at array offset). The swatches are never degraded.","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"cue_color","type":"string","desc":"Color of the pre-/retro-cue highlight ring.","default":"\"#000\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the pre-/retro-cue highlight ring.","default":"5"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start (click or onset), or from the end of the pre-cue, to object onset.","default":"500"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"feedback","type":"boolean","desc":"Ring the probed sub-feature green/red after responding and flash +10/-10.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct response.","default":"true"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"show_points","type":"boolean","desc":"Show the running points total at the top of the box (it is updated on screen only by feedback).","default":"true"},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the display.","default":"null"},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"rgb(145,145,145)\""},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from the options becoming clickable to the click. The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the committing click. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable."},{"name":"which_test","type":"integer","desc":"Index of the probed object (0..set_size-1)."},{"name":"probe_feature","type":"string","desc":"Which sub-feature was probed: \"outer\" or \"inner\"."},{"name":"feature_index","type":"integer","desc":"Sub-feature index probed: 0 = outer, 1 = inner."},{"name":"reported_index","type":"integer","desc":"Index of the clicked swatch in the recorded test_color_options (display order, left to right)."},{"name":"reported_color","type":"string","desc":"The reported (clicked) color, as CSS."},{"name":"reported_spec","type":"string","desc":"The reported (clicked) color, as originally specified."},{"name":"target_color","type":"string","desc":"The true color of the probed sub-feature, as CSS."},{"name":"target_spec","type":"string","desc":"The true color of the probed sub-feature, as originally specified."},{"name":"correct","type":"boolean","desc":"Whether the clicked swatch's resolved CSS equals the target's."},{"name":"positions","type":"integer []","desc":"Placeholder index of each presented object."},{"name":"pair_colors","type":"string []","desc":"The [outer, inner] color specs of all objects, as given/generated."},{"name":"test_color_options","type":"string []","desc":"The test-option color specs, in display order."},{"name":"set_size","type":"integer","desc":"Number of objects in the array."},{"name":"actual_stim_duration","type":"integer","desc":"Measured time (ms) from array onset to hide, via performance.now() at the paint and clear calls."},{"name":"points_total","type":"integer","desc":"Running points total after this trial (+10 correct, -10 incorrect; tallied on every trial)."},{"name":"stimuli_shown","type":"object []","desc":"One entry per object: `position` (placeholder index), `outer_value`/`inner_value` (specs), `outer_color`/`inner_color` (resolved CSS), and `probed`."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-noise-dots.js","global":"jsPsychNoiseDots","name":"noise-dots","desc":"Color-noise-dots perceptual discrimination. Shows two colored disks on a ring of placeholder locations at the same time: a target disk and a test disk.","params":[{"name":"colors","type":"string []","desc":"Candidate target colors. Each entry may be a number (degree on the color wheel), a CSS color (\"rgb(255,0,0)\", \"#0f0\"), or a \"lab(L,a,b)\" string. Only `colors[which_test]` is drawn (as the target disk); the other entries are not shown.","default":"[\"rgb(255,0,0)\"]"},{"name":"test_color","type":"object","desc":"The TEST disk color (same spec formats as `colors`).","default":"\"rgb(255,0,0)\""},{"name":"which_test","type":"integer","desc":"Index into `colors` of the target color. Out-of-range values are clamped.","default":"0"},{"name":"color_wheel","type":"object","desc":"Color wheel for degree lookups & the noise palette (default window.BradyColorWheel).","default":"null"},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced locations a disk can occupy (around a circle).","default":"8"},{"name":"radius","type":"integer","desc":"Radius (px) of the ring the disks sit on.","default":"160"},{"name":"item_size","type":"integer","desc":"Diameter (px) of each disk (the \"field\" the dots fill).","default":"90"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder indices [targetPos, testPos]. Invalid and repeated slots are dropped and entries past the second are ignored; a disk left without a slot takes the lowest unused one, so the default is [0, 1] (BradyUtils.resolvePositions with fill \"lowest\").","default":"[]"},{"name":"noise_level","type":"object","desc":"Fraction (0-1) of dots that are noise (random colors) rather than the disk's color. 0 = clean disk, 1 = pure noise (e.g. 0.4 = 40%). A scalar applies to both disks, or pass [targetNoise, testNoise] (a one-element array applies to both). Declared OBJECT so jsPsych accepts either form without a type warning.","default":"[0,0]"},{"name":"dot_size","type":"integer","desc":"Edge length (px) of each square noise dot (values below 1 are treated as 1).","default":"3"},{"name":"num_dots","type":"integer","desc":"Max number of dots drawn per disk (capped to those that fit inside it).","default":"1080"},{"name":"num_colors","type":"integer","desc":"Number of distinct hues used for the noise dots, evenly spaced around the wheel (e.g. 6 = a coarse palette). Default 360 = one per degree.","default":"360"},{"name":"display_time","type":"integer","desc":"How long (ms) the disks stay visible. null/0 = they stay up through the response (the default). If > 0, the disks are cleared after this long and only then is the response collected, against a blank field (keys pressed while the disks are up are ignored).","default":"null"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start (click or trial onset) to disk onset.","default":"500"},{"name":"response_mode","type":"string","desc":"\"two_stage\" (default), \"confidence6\", or \"binary\" (see file banner). The 1-6 scales use keys 1-6.","default":"\"two_stage\""},{"name":"same_key","type":"string","desc":"Keys for the binary same / different responses (two_stage & binary).","default":"\"s\""},{"name":"different_key","type":"string","desc":"Keys for the binary same / different responses (two_stage & binary).","default":"\"d\""},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the display.","default":"null"},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"#dddddd\""},{"name":"feedback","type":"boolean","desc":"Briefly highlight whether the same/different judgment was correct.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct response.","default":"true"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) of the first response, from response onset: the same/different RT in two_stage and binary, the scale RT in confidence6 (== rt_same_diff). Not the two_stage total. The literature's \"response initiation time\"."},{"name":"key_hold_duration","type":"integer","desc":"How long (ms) the first response's key (the one `rt` times) was held down: KeyDown -> KeyUp. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable (key never released, window blurred)."},{"name":"confidence_key_hold_duration","type":"integer","desc":"How long (ms) the two_stage confidence key was held down (null in the other modes). Named like the other plugins' confidence_mouse_hold_duration."},{"name":"key_hold_duration_confidence","type":"integer","desc":"Deprecated alias of confidence_key_hold_duration (always the same value), kept so existing analysis code keeps working. Use confidence_key_hold_duration."},{"name":"key_presses","type":"object []","desc":"Every key pressed from response onset until the first response's key is released: {key, t (ms from response onset), duration}. The two_stage confidence key is not included. `duration` is null for a key still held when the window closed (it still counts for the multi-key exclusion)."},{"name":"multiple_keys_pressed","type":"boolean","desc":"True if a key other than the first response's key was also pressed in that window (the standard RD exclusion criterion)."},{"name":"rt_same_diff","type":"integer","desc":"Same value as rt: the same/different RT in two_stage/binary, or the 1-6 scale RT in confidence6, from response onset."},{"name":"rt_confidence","type":"integer","desc":"two_stage only: RT (ms) from the confidence prompt appearing (after the same/different key is released) to the rating; else null."},{"name":"said_same","type":"integer","desc":"1 if the participant judged \"same\", 0 if \"different\". In confidence6, ratings 1-3 count as \"same\" and 4-6 as \"different\"."},{"name":"confidence","type":"integer","desc":"The 1-6 rating, or null in binary. In two_stage it is confidence magnitude (1 = guessing .. 6 = sure); in confidence6 it is the direction scale (1 = sure same .. 6 = sure different)."},{"name":"was_same","type":"boolean","desc":"Whether the test color matched the target color, compared by resolved RGB (BradyUtils.sameColor), so a wheel degree and the same color written as an rgb()/#hex/lab() string count as the same."},{"name":"correct","type":"boolean","desc":"Whether the same/different judgment was correct."},{"name":"response_mode","type":"string","desc":"Which response_mode was used."},{"name":"positions","type":"integer []","desc":"Placeholder indices used: [targetPos, testPos]."},{"name":"which_test","type":"integer","desc":"Index of the target disk within `colors`."},{"name":"target_color","type":"string","desc":"Resolved target color (CSS)."},{"name":"test_color","type":"string","desc":"Resolved test color (CSS)."},{"name":"specified_target_color","type":"string","desc":"The target color spec as given (degree / CSS / lab)."},{"name":"specified_test_color","type":"string","desc":"The test color spec as given."},{"name":"noise_level","type":"float []","desc":"Noise levels used: [targetNoise, testNoise]."},{"name":"actual_stim_duration","type":"integer","desc":"Measured time (ms) the disks were on screen before the response. With display_time > 0: from disk onset until the disks were cleared. With display_time null/0 the disks stay up through the response, so it is the time from disk onset to the first response key press (about rt, since the response opens at disk onset)."},{"name":"stimuli_shown","type":"object []","desc":"One entry per disk (target, test): {role, position, value (resolved CSS color), spec, noise_level} plus the dot-field parameters (num_dots, dot_size, num_colors, num_placeholders, radius, item_size). Individual dot positions and colors are random and not recorded."},{"name":"correct_response","type":"string","desc":"The correct same/different answer: \"same\" or \"different\"."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-recognition.js","global":"jsPsychRecognition","name":"recognition","desc":"Old/new recognition memory. Presents one test item (the probe) and asks whether it is old (seen before) or new, as a binary choice or a 1-6 rating.","params":[{"name":"stimulus","type":"object","desc":"The test item (the probe). May be a number (degree on the color wheel), a CSS color string (\"rgb(255,0,0)\", \"#0f0\"), a \"lab(L,a,b)\" string, an image path (\"face.png\", \"img/x.jpg\"), or a word (\"cat\"). Required.","default":""},{"name":"item_type","type":"string","desc":"Force interpretation of `stimulus`: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"color_wheel","type":"object","desc":"Color wheel used to turn degrees into colors. Defaults to the global window.BradyColorWheel. Pass your own { rgb(deg), css(deg) } to swap it.","default":"null"},{"name":"is_old","type":"boolean","desc":"Ground truth: was this item shown before? Used to score `correct` and for feedback. Does not affect the display.","default":"true"},{"name":"response_mode","type":"string","desc":"\"binary\" (one old vs. new choice) or \"confidence6\" (a 1-6 scale, 1 = sure new ... 6 = sure old). Same names as change-detection/noise-dots.","default":"\"binary\""},{"name":"response_ui","type":"string","desc":"How responses are collected: \"keyboard\" (old_key/new_key, or keys 1-6 for the scale), \"buttons\", or \"both\" (buttons shown and the keys armed; whichever answers first is the response, as in change-detection). Any other value warns once and behaves as \"buttons\".","default":"\"keyboard\""},{"name":"old_key","type":"string","desc":"Keyboard key for the \"old\" response (binary mode).","default":"\"o\""},{"name":"new_key","type":"string","desc":"Keyboard key for the \"new\" response (binary mode).","default":"\"n\""},{"name":"old_button_text","type":"string","desc":"Button / label text for the \"old\" response (binary mode).","default":"\"Old (seen before)\""},{"name":"new_button_text","type":"string","desc":"Button / label text for the \"new\" response (binary mode).","default":"\"New\""},{"name":"item_size","type":"integer","desc":"Diameter (px) of the probe item.","default":"120"},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"#dddddd\""},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the display (e.g. the question prompt).","default":"null"},{"name":"feedback","type":"boolean","desc":"Briefly highlight whether the response was correct after responding.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct response.","default":"true"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"},{"name":"record_mouse","type":"boolean","desc":"Record the whole-trial mouse trajectory (cursor path to the chosen button). Only meaningful with response_ui \"buttons\" or \"both\"; with \"keyboard\" a one-time console note says so.","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between mouse samples before the response phase is marked (0 = every event). The buttons appear with the probe, so this covers only the first few ms.","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between mouse samples once the response buttons are live (0 = every event).","default":"0"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from probe onset to the response. The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the committing click. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable (or the response was made with the keyboard)."},{"name":"key_hold_duration","type":"integer","desc":"How long (ms) the response key was held down: KeyDown -> KeyUp. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable (key never released, window blurred, or the response was a click)."},{"name":"key_presses","type":"object []","desc":"Every key pressed from probe onset until the response key is released (or the response click, with response_ui \"both\"): {key, t (ms from probe onset), duration}. `duration` is null for a key still held when the window closed (it still counts for the multi-key exclusion). null with response_ui \"buttons\"."},{"name":"multiple_keys_pressed","type":"boolean","desc":"True if a key other than the recorded response was also pressed (the standard RD exclusion criterion)."},{"name":"said_old","type":"integer","desc":"1 if the participant judged the item old, 0 if new. In confidence6, ratings 4-6 count as old."},{"name":"confidence","type":"integer","desc":"Confidence rating 1-6 (1 = sure new ... 6 = sure old), or null in binary mode."},{"name":"was_old","type":"boolean","desc":"Whether the probe was actually old (the `is_old` truth value)."},{"name":"correct","type":"boolean","desc":"Whether the old/new judgment was correct."},{"name":"stimulus","type":"string","desc":"The probe spec, as given."},{"name":"response_mode","type":"string","desc":"Which response_mode was used: \"binary\" or \"confidence6\"."},{"name":"response_ui","type":"string","desc":"Which response UI was used: \"keyboard\", \"buttons\" or \"both\"."},{"name":"stimuli_shown","type":"object []","desc":"One-element array describing the probe: {src} for an image, {text} for a word, or {value: the color spec as given} for a color."},{"name":"mouse_trajectory","type":"object []","desc":"Mouse-trajectory samples (only when record_mouse): rows of [t, x, y, value], value = nearest button index during the response."},{"name":"mouse_trajectory_columns","type":"string []","desc":"Column names for each mouse_trajectory row (only when record_mouse)."},{"name":"mouse_response_start_index","type":"integer","desc":"Index of the first response-phase mouse sample (only when record_mouse)."},{"name":"mouse_phase_onsets","type":"object","desc":"Only when record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at probe onset; there is no memory array or fixation in this plugin). encoding: 0, the probe and response buttons appear; report: the mouse response window opens (at the same time)."},{"name":"mouse_zoom","type":"float","desc":"Auto-zoom scale of the box, for unscaling mouse coordinates (only when record_mouse)."},{"name":"mouse_geometry","type":"object","desc":"Layout in the mouse-trajectory frame (only when record_mouse): each response button's box (index/value/correct/x/y/w/h) and target_option (the correct button, binary mode only)."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-recall.js","global":"jsPsychRecall","name":"recall","desc":"Working-memory cued recall, typed. Shows a memory array of items around a circle, a blank retention delay, then rings one location (the probe) and asks the participant to type what was there into a text or number field.","params":[{"name":"stimuli","type":"string []","desc":"The memory-array items. Each entry may be a JS number (a degree on the color wheel), a CSS color string (\"rgb(255,0,0)\", \"#0f0\"), a \"lab(L,a,b)\" string, an image path (\"dog.png\", \"img/x.jpg\"), or text, including digits as a string (\"cat\", \"7\"). Force the interpretation with `item_type`. Text items are inserted as HTML, not as plain text: \"<b>cat</b>\" shows a bold word, and a literal \"<\", \">\" or \"&\" must be written as \"&lt;\", \"&gt;\", \"&amp;\". Scoring compares the typed answer with the spec as given (markup included), so set correct_answer when a text item contains markup or entities.","default":"[]"},{"name":"item_type","type":"string","desc":"Force interpretation of `stimuli`: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"color_wheel","type":"object","desc":"Color wheel used to turn degrees into colors (defaults to window.BradyColorWheel).","default":"null"},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced locations items can occupy (around a circle). Raised to the number of items, and to cover any explicit item_positions, if smaller.","default":"8"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"radius","type":"integer","desc":"Radius (px) of the circle the items are arranged on.","default":"160"},{"name":"item_size","type":"integer","desc":"Side length (px) of each item box.","default":"100"},{"name":"font_size","type":"string","desc":"Font size (CSS string) for text items in the memory array (the input field has its own fixed 32pt size).","default":"\"16pt\""},{"name":"which_test","type":"integer","desc":"Index (0..stimuli.length-1) of the item whose location is probed. Out-of-range values are clamped.","default":"0"},{"name":"do_test","type":"boolean","desc":"If false, just present the array + delay and end (encoding-only, no test).","default":"true"},{"name":"display_time","type":"integer","desc":"How long (ms) the memory array is shown (0 = not shown, unless sequential).","default":"500"},{"name":"sequential","type":"boolean","desc":"Present the memory items one at a time in their placeholders (instead of all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms) between array offset and the recall probe. With mask_time > 0 it starts when the mask comes off, and still runs in full.","default":"800"},{"name":"precue_time","type":"integer","desc":"If > 0, ring the to-be-probed location (`cue_color`/`cue_thickness`) for this long right after the start, then wait delay_start before the array. Skipped when do_test is false (there is no probe to cue). 0 = off.","default":"0"},{"name":"retrocue_time","type":"integer","desc":"If > 0, after the delay ring the to-be-probed location (`cue_color`/`cue_thickness`; the defaults match the probe ring) for this long before the response field appears. 0 = off.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. Skipped when do_test is false. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}).","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each item covered by the `noise_type` degradation (a transparent overlay over the item's box -- occlusion for images/words; removed at array offset).","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"cue_color","type":"string","desc":"Color of the pre-/retro-cue highlight ring.","default":"\"#000\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the pre-/retro-cue highlight ring.","default":"5"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start (click or trial onset), or from the end of the pre-cue, to array onset.","default":"500"},{"name":"response_location","type":"string","desc":"Where the typed-response field appears: \"center\" (at fixation) or \"bottom\" (below the stage).","default":"\"center\""},{"name":"input_type","type":"string","desc":"Input field type: \"text\" or \"number\".","default":"\"text\""},{"name":"input_min","type":"integer","desc":"Min value (number inputs only); null to omit.","default":"null"},{"name":"input_max","type":"integer","desc":"Max value (number inputs only); null to omit.","default":"null"},{"name":"input_step","type":"float","desc":"Step (number inputs only); null to omit.","default":"null"},{"name":"input_placeholder","type":"string","desc":"Placeholder text shown in the empty input field.","default":"\"\""},{"name":"button_label","type":"string","desc":"Label on the submit button.","default":"\"Submit\""},{"name":"correct_answer","type":"string","desc":"The expected answer used to score accuracy. If null (default), the spec of the probed item (stimuli[which_test]) is used. Scoring trims leading/trailing whitespace, treats any run of internal whitespace as one space (\"ice cream\" matches \"ice cream\"), and ignores case. When both sides parse fully as numbers they are compared numerically (\"07\" and \"7.0\" match \"7\"). Set this when the typed answer differs from the displayed spec (e.g. a label for an image, or a word for a color).","default":"null"},{"name":"feedback","type":"boolean","desc":"Show \"Correct!\"/\"Incorrect\" + a green/red highlight after responding.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct response.","default":"true"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the display.","default":"null"},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"#dddddd\""},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from probe onset to submitting the typed answer (the click, or the Enter KeyDown). The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the committing click on the Submit button. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null when the answer was submitted with the Enter key (see key_hold_duration) or not measurable."},{"name":"key_hold_duration","type":"integer","desc":"How long (ms) the Enter key was held when submitting by keyboard: KeyDown -> KeyUp. The keyboard counterpart of mouse_hold_duration; at most one of the two is non-null per response. There is no key_presses log: every typed character would land in it, which makes the multi-key exclusion meaningless for a typing field."},{"name":"response","type":"string","desc":"The raw value typed by the participant (untrimmed)."},{"name":"correct","type":"boolean","desc":"Whether the typed answer matched the expected answer (see correct_answer); null if there is no answer to score against or no test."},{"name":"target","type":"string","desc":"The expected answer used for scoring (null if none)."},{"name":"which_test","type":"integer","desc":"Index of the probed item (after clamping)."},{"name":"positions","type":"integer []","desc":"Placeholder index of each presented item."},{"name":"stimuli","type":"string []","desc":"The studied item specs (colors/degrees/images/text), as given."},{"name":"actual_display_time","type":"integer","desc":"Measured time (ms) from array onset to hide, via performance.now() at the paint and clear calls."},{"name":"actual_stim_duration","type":"integer","desc":"Same value as actual_display_time (kept under the name the other plugins use)."},{"name":"stimuli_shown","type":"object []","desc":"One entry per item: `position` (placeholder index), `order` (index in the list, which is also the sequential presentation order), `value` (spec), `probed`, and `src`/`color`/`text`."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-spatial-report.js","global":"jsPsychSpatialReport","name":"spatial-report","desc":"Spatial location memory. Shows a memory array of items at locations around a circle, a blank delay, then shows one of the items at the centre and asks where it was.","params":[{"name":"stimuli","type":"string []","desc":"The memory-array items. Each entry may be a number (degree on the color wheel), a CSS color string (\"rgb(255,0,0)\", \"#0f0\"), a \"lab(L,a,b)\" string, an image path (\"dog.png\", \"img/x.jpg\"), or a word (\"cat\"). If empty, `set_size` random wheel colors (>= `min_color_distance` deg apart) are generated.","default":"[]"},{"name":"item_type","type":"string","desc":"Force interpretation of `stimuli`: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"set_size","type":"integer","desc":"Number of items to auto-generate when `stimuli` is empty.","default":"3"},{"name":"min_color_distance","type":"integer","desc":"Min separation (deg) between auto-generated wheel colors.","default":"25"},{"name":"color_wheel","type":"object","desc":"Color wheel used to turn degrees into colors. Defaults to the global window.BradyColorWheel. Pass your own { rgb(deg), css(deg) } to swap it.","default":"null"},{"name":"num_placeholders","type":"integer","desc":"Number of equally spaced locations around the circle. Raised to set_size (or past the largest item_positions index) if smaller. Location 0 is straight below the centre and the indices run counterclockwise on screen.","default":"8"},{"name":"radius","type":"integer","desc":"Radius (px) of the circle the items are arranged on.","default":"160"},{"name":"item_size","type":"integer","desc":"Diameter (px) of each item / placeholder box.","default":"90"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"which_test","type":"integer","desc":"Index (0..set_size-1) of the item that is probed at test.","default":"0"},{"name":"response_mode","type":"string","desc":"How the location is reported: \"box\" (click a placeholder), \"click\" (click anywhere), or \"drag\" (drag the probe).","default":"\"box\""},{"name":"show_placeholders","type":"boolean","desc":"Whether the empty placeholder outlines stay visible during the response. Ignored (always shown) in \"box\" mode, which needs the boxes to click. In \"click\" / \"drag\" they are optional spatial guides. They are always shown during the memory array.","default":"true"},{"name":"display_time","type":"integer","desc":"How long (ms) the memory array is shown.","default":"500"},{"name":"sequential","type":"boolean","desc":"Present the memory items one at a time in their placeholders (instead of all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms) between array offset and the probe. With mask_time > 0 it starts when the mask comes off, and still runs in full.","default":"800"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start (click or trial onset) to array onset.","default":"500"},{"name":"precue_time","type":"integer","desc":"If > 0, pre-cue: highlight the to-be-probed location (a `cue_color`/`cue_thickness` ring) for this long before the array. In a location task the cue gives away the answer, so use it deliberately. Skipped when do_test is false (there is no probe to cue). 0 = off.","default":"0"},{"name":"retrocue_time","type":"integer","desc":"If > 0, retro-cue: after the retention delay, highlight the to-be-probed location for this long before the response. Gives away the answer in a location task. 0 = off.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}).","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each item covered by the `noise_type` degradation (a transparent overlay; removed at array offset).","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"cue_color","type":"string","desc":"Color of the pre-/retro-cue highlight ring.","default":"\"#000\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the pre-/retro-cue highlight ring.","default":"5"},{"name":"do_test","type":"boolean","desc":"If false, skip the test/response entirely (encoding-only trial).","default":"true"},{"name":"background_color","type":"string","desc":"Background color of the stimulus field.","default":"\"#dddddd\""},{"name":"feedback","type":"boolean","desc":"After the response, show the true location (green ring), the wrong box if any (red ring), the click/drop point in \"click\"/\"drag\" mode, and the error in px, for 900 ms.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct response (nearest placeholder is the true one).","default":"true"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the display (instructions, etc.).","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus field with CSS transform to fill the browser window.","default":"false"},{"name":"record_mouse","type":"boolean","desc":"Record the mouse trajectory from trial start (the fixation click, or trial onset when click_to_start is false) to the response.","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between recorded mouse samples (0 = every event).","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between recorded mouse samples during the report phase (0 = every event).","default":"0"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from probe onset to the committing click, or in \"drag\" mode to the drop (so it includes the drag itself; the drag started at drag_start_rt). null if do_test is false. The literature's \"response initiation time\" in \"box\"/\"click\" mode."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the committing click, in \"box\" and \"click\" modes. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. Always null in \"drag\" mode, where the press is a movement and is reported as `drag_duration` instead; never pool the two. null if not measurable."},{"name":"drag_duration","type":"integer","desc":"\"drag\" mode only: how long (ms) the button was held across the drag, from the mousedown that grabs the probe to the mouseup that drops it. This is a movement time, not a response duration in the sense of Zhou et al.: it depends mostly on how far the probe had to travel, so it is not comparable to `mouse_hold_duration`. null outside \"drag\" mode."},{"name":"drag_start_rt","type":"integer","desc":"\"drag\" mode only: time (ms) from probe onset to the mousedown that grabs the probe, i.e. when the drag started. With drag_duration, rt is about drag_start_rt + drag_duration. null outside \"drag\" mode (and if do_test is false)."},{"name":"reported_x","type":"float","desc":"Reported x location (px, field frame: from the field's inner left edge, unscaled by auto_zoom). \"box\": the clicked placeholder's centre; \"click\": the click point; \"drag\": the dropped probe's centre."},{"name":"reported_y","type":"float","desc":"Reported y location (px, field frame, y down)."},{"name":"true_x","type":"float","desc":"True x location (px, field frame) of the probed item's placeholder centre; null if do_test is false."},{"name":"true_y","type":"float","desc":"True y location (px, field frame) of the probed item's placeholder centre; null if do_test is false."},{"name":"spatial_error","type":"float","desc":"Spatial error: Euclidean distance (px, unsigned) between reported and true location. Signed components are reported_x - true_x and reported_y - true_y."},{"name":"response_mode","type":"string","desc":"\"box\", \"click\", or \"drag\"."},{"name":"clicked_position","type":"integer","desc":"\"box\": the placeholder clicked. \"click\"/\"drag\": the placeholder whose centre is nearest the reported point. null if do_test is false."},{"name":"correct_position","type":"integer","desc":"Placeholder index the probed item actually occupied."},{"name":"correct","type":"boolean","desc":"clicked_position === correct_position, i.e. in \"click\"/\"drag\" mode the nearest placeholder is the true one. null if do_test is false."},{"name":"positions","type":"integer []","desc":"Placeholder index of each presented item."},{"name":"stimuli","type":"string []","desc":"The studied item specs (colors/degrees/images/words), as given/generated."},{"name":"which_test","type":"integer","desc":"Index of the probed item."},{"name":"set_size","type":"integer","desc":"Number of items shown."},{"name":"actual_stim_duration","type":"integer","desc":"Measured ms the memory array was actually on screen (onset to hide)."},{"name":"stimuli_shown","type":"object []","desc":"One entry per presented item: placeholder index, centre (x,y, px, field frame), and value (color/degree/image src/word)."},{"name":"target_index","type":"integer","desc":"Index into stimuli_shown of the probed item (= which_test)."},{"name":"mouse_trajectory","type":"object []","desc":"record_mouse: recorded mouse samples, each a [t, x, y, value] row (see mouse_trajectory_columns)."},{"name":"mouse_trajectory_columns","type":"string []","desc":"record_mouse: column names for each mouse_trajectory row."},{"name":"mouse_response_start_index","type":"integer","desc":"record_mouse: index into mouse_trajectory of the first report-phase sample."},{"name":"mouse_phase_onsets","type":"object","desc":"record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at the fixation click, or at trial start when click_to_start is false). encoding: 0, tracking start, which comes before any pre-cue and delay_start; array: the memory array's onset; mask: the mask's onset, which is the array's offset (only on trials that show a mask); delay: the blank retention interval begins, at the array's offset or, after a mask, at the mask's offset; report: the probe appears. Any retro-cue falls between delay and report."},{"name":"mouse_zoom","type":"float","desc":"record_mouse: CSS zoom/scale factor applied to the box when sampling (for un-zooming coords)."},{"name":"mouse_geometry","type":"object","desc":"record_mouse: layout in the mouse-trajectory frame (logical px from the field centre): the item boxes (value = placeholder index, target flagged). wheel, wheel_points and target_point are null (no response wheel)."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-rsvp.js","global":"jsPsychRsvp","name":"rsvp","desc":"Rapid serial visual presentation. Shows a stream of stimuli one at a time at the same screen location, each for item_duration ms with an optional blank ISI after it.","params":[{"name":"stimuli","type":"string []","desc":"The stream, in presentation order. Each entry may be a number (degree on the color wheel), a CSS color string (\"rgb(255,0,0)\", \"#0f0\"), a \"lab(L,a,b)\" string, an image path (\"dog.png\", \"img/x.jpg\"), or text (\"cat\"). Required.","default":""},{"name":"item_type","type":"string","desc":"Force interpretation of `stimuli`: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"color_wheel","type":"object","desc":"Color wheel used to turn degrees into colors. Defaults to the global window.BradyColorWheel. Pass your own { rgb(deg), css(deg) } to swap it.","default":"null"},{"name":"item_duration","type":"object","desc":"Time in ms each stimulus is shown. A single value (or length-1 array) applies to every item; otherwise give one value per item. A shorter array is padded with its last value (with a console warning). Declared OBJECT, not INT, because jsPsych 8 coerces a non-array INT parameter to a number and would turn a per-item array into NaN.","default":"100"},{"name":"isi","type":"object","desc":"Blank inter-stimulus interval (ms) after each item, including the last. A single value (or length-1 array) applies to every item; otherwise one per item (a shorter array is padded with its last value). Default 0: items are back to back with no blank frame between them. OBJECT for the same reason as item_duration.","default":"0"},{"name":"item_size","type":"integer","desc":"Size (px) of the square presentation area / each item.","default":"200"},{"name":"background_color","type":"string","desc":"Background color of the presentation box.","default":"\"#ffffff\""},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the stream (e.g. task instructions).","default":"null"},{"name":"response_keys","type":"keys","desc":"Optional keys to listen for during the stream (e.g. [\"f\"] to flag a detected target). null (default) collects no response. Every press of a listed key is logged (a held key counts once); none ends the trial early.","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the presentation box with CSS transform to fill the window.","default":"false"}],"data":[{"name":"stimuli","type":"string []","desc":"The stream item specs, in presentation order (as given / resolved)."},{"name":"item_duration","type":"integer []","desc":"Requested per-item display durations (ms), expanded to one per item."},{"name":"isi","type":"integer []","desc":"Requested per-item ISIs (ms), expanded to one per item."},{"name":"actual_stim_timing","type":"float []","desc":"Measured time (ms) from each item's paint call to its clear call (or to the next item's paint, when isi is 0)."},{"name":"actual_isi_timing","type":"float []","desc":"Measured blank time (ms) after each item; 0 when isi is 0."},{"name":"actual_stim_duration","type":"integer","desc":"Measured duration (ms) of the whole stream: first item onset to last item offset."},{"name":"responses","type":"object []","desc":"All key responses during the stream: [{ key, rt, item, during_isi }]. rt is ms from stream onset (first item painted). item is the index of the most recently painted item (null before the first one), so a press during a blank ISI is credited to the item just before it. during_isi is true if that item had already been cleared (the press fell in its blank ISI, including the blank after the last item), false while it was on screen. Both are stamped when the key event is handled, not at the screen refresh."},{"name":"rt","type":"integer","desc":"RT (ms, from stream onset) of the first response, or null. The literature's \"response initiation time\"."},{"name":"response","type":"string","desc":"Key of the first response, or null."},{"name":"key_hold_duration","type":"integer","desc":"How long (ms) the first response key was held down: KeyDown -> KeyUp. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable (still held at stream end, window blurred). Later responses' holds are in key_presses."},{"name":"key_presses","type":"object []","desc":"Every key pressed during the stream (any key, not only response_keys): {key, t (ms from stream onset), duration}. `duration` is null for a key still held when the stream ended (it still counts for the multi-key exclusion). Only when response_keys is set; else null."},{"name":"multiple_keys_pressed","type":"boolean","desc":"True if a key other than the recorded response was also pressed (the standard RD exclusion criterion)."},{"name":"stimuli_shown","type":"object []","desc":"One entry per stream item: `position` (serial position), `kind`, `spec`, the resolved `src`/`text`/`css` (+ `degree` for numeric specs), and its requested `item_duration`/`isi`."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-object-orientation-report.js","global":"jsPsychObjectOrientationReport","name":"object-orientation-report","desc":"Orientation working memory for real objects (the orientation counterpart of jspsych-continuous-object-report.js, which does color). Object photos are shown at placeholder locations, each rotated in its box by its own orientation (a CSS transform).","params":[{"name":"stimuli","type":"image []","desc":"Per-item object image URLs (one per item). One value = same image for all; empty falls back to `object_image`.","default":"[]"},{"name":"object_image","type":"image","desc":"A single object image used for every item (when `stimuli` is empty).","default":"null"},{"name":"set_size","type":"integer","desc":"Number of items in the memory array.","default":"3"},{"name":"orientations","type":"integer []","desc":"Per-item true orientations (deg, 0 = the photo as drawn, positive = clockwise). Shorter lists repeat (one value = all the same). Empty = random integers in [0, orientation_period).","default":"[]"},{"name":"orientation_period","type":"integer","desc":"Orientation period (deg): 360 (default) or 180 for an object that looks the same after a half turn. Sets the error range (+/- period/2) and the range of random orientations. Values <= 0 fall back to 360.","default":"360"},{"name":"orientation_num_choices","type":"integer","desc":"Quantize the orientation response to this many steps around the full 360 deg, anchored on the target so it is always selectable (0 = continuous). With orientation_period 180, n steps give n/2 distinct orientations. Same name and grid as continuous-report's orientation quantizer.","default":"0"},{"name":"report_location","type":"string","desc":"Where the report happens: \"center\" (probe shown centrally) or \"in_place\" (spin it in its own box).","default":"\"center\""},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced placeholder locations.","default":"8"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"which_test","type":"integer","desc":"Index (0..set_size-1) of the probed item.","default":"0"},{"name":"radius","type":"integer","desc":"Radius (px) of the placeholder ring.","default":"160"},{"name":"item_size","type":"integer","desc":"Item display size (px, square).","default":"100"},{"name":"display_time","type":"integer","desc":"How long (ms) the memory array is shown.","default":"500"},{"name":"sequential","type":"boolean","desc":"Present the memory items one at a time in their placeholders (instead of all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms) before the probe. With mask_time > 0 it starts when the mask comes off, and still runs in full.","default":"800"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from trial start to array onset.","default":"500"},{"name":"precue_time","type":"integer","desc":"If > 0, highlight the to-be-probed location (a `cue_color`/`cue_thickness` ring) for this long before the array. Skipped when do_test is false.","default":"0"},{"name":"retrocue_time","type":"integer","desc":"If > 0, retro-cue: after the retention delay, highlight the to-be-probed location for this long before the response. 0 = off.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}).","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each item's placeholder covered by the `noise_type` degradation, drawn on a transparent overlay above the rotated photo and removed at array offset.","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"cue_color","type":"string","desc":"Color of the pre-/retro-cue highlight ring.","default":"\"#000\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the pre-/retro-cue highlight ring.","default":"5"},{"name":"cue_items","type":"boolean","desc":"Outline the probed location while the array is up.","default":"false"},{"name":"do_test","type":"boolean","desc":"If false, skip the test/response entirely (encoding-only trial).","default":"true"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"background_color","type":"string","desc":"Background color of the box.","default":"\"#dddddd\""},{"name":"placeholder_border","type":"string","desc":"CSS border on every placeholder location (\"none\" = invisible). Visible by default so the spatial layout is shown.","default":"\"2px solid #ccc\""},{"name":"auto_zoom","type":"boolean","desc":"Scale the box with CSS transform to fill the browser window.","default":"false"},{"name":"feedback","type":"boolean","desc":"After the response, rotate the object to its true orientation and show the error for 1200 ms.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct (small-error) response.","default":"true"},{"name":"feedback_threshold","type":"integer","desc":"Abs error (deg) at/under which a response counts \"correct\" for the reward cue.","default":"20"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"prompt","type":"HTML string","desc":"Optional HTML prompt shown at the top of the box.","default":"null"},{"name":"record_mouse","type":"boolean","desc":"Record the mouse trajectory from trial start (the fixation click, or trial onset when click_to_start is false) to the response.","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between recorded mouse samples (0 = every event).","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between recorded mouse samples during the report phase (0 = every event).","default":"0"}],"data":[{"name":"reported_orientation","type":"integer","desc":"Reported orientation (deg, integer in [0, orientation_period), clockwise from the photo as drawn); after snapping when orientation_num_choices > 0. With orientation_period 180 a pointer at 250 is recorded as 70. null if do_test is false."},{"name":"orientation_error","type":"integer","desc":"Signed error (reported - target) in (-orientation_period/2, orientation_period/2], rounded. null if do_test is false."},{"name":"target_orientation","type":"integer","desc":"True orientation (deg, [0, orientation_period)) of the probed item."},{"name":"orientations","type":"integer []","desc":"True per-item orientations (deg, [0, orientation_period))."},{"name":"orientation_period","type":"integer","desc":"The orientation period (deg) the orientation fields use: the orientation_period parameter, or 360 when it is <= 0. Orientations are recorded in [0, period) and the error wraps at +/- period/2."},{"name":"positions","type":"integer []","desc":"Placeholder index of each item."},{"name":"which_test","type":"integer","desc":"Index of the probed item."},{"name":"set_size","type":"integer","desc":"Number of items in the array."},{"name":"rt","type":"integer","desc":"Response time (ms) from probe onset to the click; null if do_test is false. The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the committing click. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if n
