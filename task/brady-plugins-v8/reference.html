  <script>
  const PLUGINS = [{"file":"jspsych-change-detection.js","global":"jsPsychChangeDetection","name":"change-detection","desc":"Working-memory change detection. Shows a memory array, a blank delay, then re-shows one item (the probe) at its studied location.","params":[{"name":"stimuli","type":"string []","desc":"The memory-array items. Each entry may be a number (degree on the color wheel), a CSS color string (\"rgb(255,0,0)\", \"#0f0\"), a \"lab(L,a,b)\" string, an image path (\"dog.png\", \"img/x.jpg\"), or a word (\"cat\"). If empty, `set_size` random wheel colors (>= `min_color_distance` deg apart) are generated.","default":"[]"},{"name":"item_type","type":"string","desc":"Force interpretation of `stimuli`: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"item_shape","type":"string","desc":"Item shape: \"disk\" (default) or \"square\", a filled square the size of the disk (the Luck & Vogel style display). The placeholders, cue rings and noise/mask overlays take the same shape.","default":"\"disk\""},{"name":"set_size","type":"integer","desc":"Number of items to auto-generate when `stimuli` is empty.","default":"3"},{"name":"min_color_distance","type":"integer","desc":"Min separation (deg) between auto-generated wheel colors.","default":"25"},{"name":"color_wheel","type":"object","desc":"Color wheel used to turn degrees into colors. Defaults to the global window.BradyColorWheel. Pass your own { rgb(deg), css(deg) } to swap it.","default":"null"},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced locations items can occupy (around a circle).","default":"8"},{"name":"radius","type":"integer","desc":"Radius (px) of the circle the items are arranged on.","default":"160"},{"name":"item_size","type":"integer","desc":"Diameter (px) of each item.","default":"90"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"which_test","type":"integer","desc":"Index (0..set_size-1) of the item probed at test. Out-of-range values are clamped.","default":"0"},{"name":"is_change","type":"boolean","desc":"Whether the probe is a changed item. Ignored if `test_stimulus` is given. Color items are changed by `change_amount`; images and words cannot be changed automatically (the probe stays identical and was_same is true), so supply `test_stimulus` for those.","default":"false"},{"name":"change_amount","type":"integer","desc":"Size of an automatic color change (deg). Wheel-degree items move this far around the wheel; CSS/lab color items are hue-rotated this far in CIELAB a*b*.","default":"60"},{"name":"test_stimulus","type":"object","desc":"Explicit probe (degree / color / image / word). Overrides is_change; was_same is then computed by comparing the resolved probe to the studied item.","default":"null"},{"name":"display_time","type":"integer","desc":"How long (ms) the memory array is shown.","default":"500"},{"name":"sequential","type":"boolean","desc":"Present the memory items one at a time in their placeholders (instead of all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms). It starts when the array is cleared, or when the mask comes off if there is one, and always runs in full; any retro-cue comes after it. Probe onset = array offset + mask_time + delay_time + retrocue_time.","default":"800"},{"name":"precue_time","type":"integer","desc":"If > 0, ring the to-be-probed location (`cue_color`/`cue_thickness`) for this long before the array; delay_start then runs as usual. 0 = off.","default":"0"},{"name":"retrocue_time","type":"integer","desc":"If > 0, ring the to-be-probed location for this long after the delay, before the probe appears. The ring stays on through the response. 0 = off.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}). The default \"color-squares\" is a field of random-colored squares.","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each item covered by the `noise_type` degradation, drawn on a transparent overlay over the item (the default speckle gives integrated chromatic patches). Applies to every item kind (it occludes images and words); the probe is always noise-free.","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"cue_color","type":"string","desc":"Color of the pre-/retro-cue highlight ring.","default":"\"#000\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the pre-/retro-cue highlight ring.","default":"5"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start (click or trial onset) to array onset; with a precue, from the end of the precue.","default":"500"},{"name":"response_mode","type":"string","desc":"\"binary\" (same/different), \"confidence6\" (one 1-6 scale, 1 = sure same, 6 = sure different), or \"two_stage\" (same/different, then 1-6 confidence, 1 = guessing, 6 = sure).","default":"\"binary\""},{"name":"response_ui","type":"string","desc":"How responses are collected: \"both\" (clickable buttons AND keyboard, the default), \"buttons\" (mouse only), \"keyboard\" (keys only), or \"radio\" (radio buttons + a Submit button). The 1-6 scales use keys 1-6. An unrecognized value falls back to \"both\".","default":"\"both\""},{"name":"same_key","type":"string","desc":"Keyboard keys for the same / different responses (binary and two_stage stage 1).","default":"\"s\""},{"name":"different_key","type":"string","desc":"Keyboard keys for the same / different responses (binary and two_stage stage 1).","default":"\"d\""},{"name":"same_button_text","type":"string","desc":"Button/label text for the binary same / different responses.","default":"\"Same\""},{"name":"different_button_text","type":"string","desc":"Button/label text for the binary same / different responses.","default":"\"Different\""},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the display.","default":"null"},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"#dddddd\""},{"name":"feedback","type":"boolean","desc":"Briefly highlight whether the response was correct after responding.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct response.","default":"true"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"},{"name":"record_mouse","type":"boolean","desc":"Record the whole-trial mouse trajectory (cursor path to the response). Only meaningful with a clickable UI (\"both\", \"buttons\", \"radio\").","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between mouse samples during encoding/delay (0 = every event).","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between mouse samples once the probe/response appears (0 = every event).","default":"0"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from probe onset to the final response (the confidence rating in two_stage). The literature's \"response initiation time\"."},{"name":"rt_same_diff","type":"integer","desc":"Response time (ms) from probe onset to the same/different decision (== rt in binary and confidence6). The literature's \"response initiation time\"."},{"name":"rt_confidence","type":"integer","desc":"Response time (ms) from the confidence prompt appearing to the confidence response (two_stage only; else null). Timed from the prompt rather than the decision so that a keyboard decision's hold, which delays the prompt until the key is released, is not counted as confidence deliberation."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the click that made the same/different decision (the response rt_same_diff times; in confidence6 that is the rating click). \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable or the decision was a keypress."},{"name":"key_hold_duration","type":"integer","desc":"How long (ms) the same/different decision key was held down: KeyDown -> KeyUp. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable (key never released, window blurred) or the decision was a click."},{"name":"confidence_mouse_hold_duration","type":"integer","desc":"two_stage only: how long (ms) the mouse button was held for the confidence-rating click, a separate response from the decision. null if the rating was a keypress, or outside two_stage."},{"name":"confidence_key_hold_duration","type":"integer","desc":"two_stage only: how long (ms) the confidence-rating key was held down. null if the rating was a click, or outside two_stage. Named like confidence_mouse_hold_duration."},{"name":"key_hold_duration_confidence","type":"integer","desc":"Deprecated alias of confidence_key_hold_duration (always the same value), kept so existing analysis code keeps working. Use confidence_key_hold_duration."},{"name":"key_presses","type":"object []","desc":"Every key pressed from probe onset until the same/different decision is complete: {key, t (ms from probe onset), duration}. The two_stage confidence key is not included. `duration` is null for a key still held when the window closed (it still counts for the multi-key exclusion). null when the keyboard is not in use (response_ui \"buttons\"/\"radio\")."},{"name":"multiple_keys_pressed","type":"boolean","desc":"True if a key other than the recorded decision key was also pressed in that window (the standard RD exclusion criterion)."},{"name":"said_same","type":"integer","desc":"1 if the participant judged \"same\", 0 if \"different\". In confidence6, ratings 1-3 count as \"same\" and 4-6 as \"different\"."},{"name":"confidence","type":"integer","desc":"Confidence rating 1-6. In confidence6 it is the direction scale (1 = sure same ... 6 = sure different). In two_stage it is the magnitude scale (1 = guessing ... 6 = sure) and the direction is in said_same. null in binary."},{"name":"was_same","type":"boolean","desc":"Whether the probe matched the studied item. Colors are compared by resolved RGB (BradyUtils.sameColor), so a wheel degree and the same color written as an rgb()/#hex/lab() string count as the same; images by src, text by string."},{"name":"correct","type":"boolean","desc":"Whether the same/different judgment was correct."},{"name":"positions","type":"integer []","desc":"Placeholder index of each presented item."},{"name":"stimuli","type":"string []","desc":"The studied item specs (degrees/colors/images/words), as given or generated."},{"name":"item_shape","type":"string","desc":"Item shape used (\"disk\" or \"square\")."},{"name":"test_stimulus","type":"string","desc":"The probe spec."},{"name":"which_test","type":"integer","desc":"Index of the probed item (after clamping into range)."},{"name":"actual_stim_duration","type":"integer","desc":"Measured time (ms) from array onset until the array was cleared. In sequential mode it spans the whole sequence, including the gap after the last item."},{"name":"response_mode","type":"string","desc":"Response collection mode used (\"binary\", \"confidence6\", or \"two_stage\")."},{"name":"response_ui","type":"string","desc":"Response UI used (\"both\", \"buttons\", \"keyboard\", or \"radio\")."},{"name":"set_size","type":"integer","desc":"Number of items in the memory array."},{"name":"study_stimuli","type":"object []","desc":"Full study display: per item {position, value, and color/src/text}."},{"name":"stimuli_shown","type":"object []","desc":"Same content as study_stimuli, under the field name every plugin uses (see CONVENTIONS.md)."},{"name":"test_stimuli","type":"object []","desc":"Test display: a one-element array holding the probe {position, value, and color/src/text}."},{"name":"changed_index","type":"integer","desc":"Index of the probed item (== which_test), whether or not it changed."},{"name":"changed_position","type":"integer","desc":"Placeholder index of the probed item."},{"name":"change_old_value","type":"string","desc":"Studied value (spec) of the probed item."},{"name":"change_new_value","type":"string","desc":"Value (spec) shown at the probed location at test (== test_stimulus)."},{"name":"did_change","type":"boolean","desc":"Whether the probe differed from the studied item (== !was_same)."},{"name":"correct_response","type":"string","desc":"The correct same/different answer (\"same\" or \"different\")."},{"name":"mouse_trajectory","type":"object []","desc":"Mouse-trajectory samples (only when record_mouse): rows of [t, x, y, value], value = index of the nearest response button during the response (null before it, and during two_stage stage 2)."},{"name":"mouse_trajectory_columns","type":"string []","desc":"Column names for each mouse_trajectory row (only when record_mouse)."},{"name":"mouse_response_start_index","type":"integer","desc":"Index of the first response-phase mouse sample (only when record_mouse)."},{"name":"mouse_phase_onsets","type":"object","desc":"Only when record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at the fixation click, or at trial start when click_to_start is false). encoding: 0, tracking start, which comes before any pre-cue and delay_start; array: the memory array's onset; mask: the mask's onset, which is the array's offset (only on trials that show a mask); delay: the blank retention interval begins, at the array's offset or, after a mask, at the mask's offset; report: the probe and the response options appear (any retro-cue falls between delay and report); confidence: two_stage only, the rating options replace the same/different options."},{"name":"mouse_zoom","type":"float","desc":"Auto-zoom scale of the box, for unscaling mouse coordinates (only when record_mouse)."},{"name":"mouse_geometry","type":"object","desc":"Layout in the mouse-trajectory frame (only when record_mouse): the same/different (or 1-6) buttons' or radio labels' boxes and target_option (the correct same/different option; none for the 1-6 scale). null when no clickable options were shown (response_ui \"keyboard\")."},{"name":"confidence_geometry","type":"object","desc":"two_stage only: the stage-2 rating buttons' (or radio labels') boxes, in the same frame as mouse_geometry, captured when they appear (the stage-1 options are gone by then). null otherwise."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-2afc-keyboard.js","global":"jsPsych2afcKeyboard","name":"2afc-keyboard","desc":"Forced choice between options shown side by side, answered with the keyboard. choice_keys[i] picks the option at spatial position i, counting from the left (so with [\"f\",\"j\"], f = left, j = right).","params":[{"name":"stimuli","type":"string []","desc":"The options to choose between, in canonical order. Each entry may be a number (color-wheel degree), a CSS color / \"lab(...)\" string, an image path, or a word. One per choice key. Required.","default":""},{"name":"item_type","type":"string","desc":"Force interpretation of `stimuli`: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"color_wheel","type":"object","desc":"Color wheel for degree lookups (defaults to window.BradyColorWheel).","default":"null"},{"name":"choice_keys","type":"keys []","desc":"Keys for the spatial positions, left to right (e.g. [\"f\",\"j\"]): choice_keys[i] picks whichever option is drawn at position i. Same name as wm-forced-choice. Keys beyond the number of options are ignored.","default":"[\"f\",\"j\"]"},{"name":"correct_option","type":"integer","desc":"Canonical index (into `stimuli`, not the shuffled position) of the correct option, for accuracy and feedback, or null. Same name as wm-forced-choice.","default":"null"},{"name":"color_rotation_deg","type":"integer []","desc":"Optional per-stimulus hue rotation (deg) in CIELAB, indexed like `stimuli`, applied to image options only. Empty (default) or 0 = image shown unmodified.","default":"[]"},{"name":"shuffle_options","type":"boolean","desc":"Randomize the left-to-right order of the options (as in wm-forced-choice).","default":"true"},{"name":"preview_duration","type":"integer","desc":"If > 0, show the options in grayscale for this long first; the keyboard is not yet live.","default":"0"},{"name":"prompt_lead_time","type":"integer","desc":"If > 0, show the prompt alone (options hidden) for this long, then reveal the options and enable the keyboard together.","default":"0"},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the options (e.g. the question).","default":"null"},{"name":"item_size","type":"integer","desc":"Size (px) of color and word options. Images use stimulus_width/height or their natural size.","default":"120"},{"name":"stimulus_width","type":"integer","desc":"Explicit image width/height (px); null leaves natural size. Giving only one keeps the aspect ratio.","default":"null"},{"name":"stimulus_height","type":"integer","desc":"Explicit image width/height (px); null leaves natural size. Giving only one keeps the aspect ratio.","default":"null"},{"name":"feedback","type":"boolean","desc":"Briefly highlight the chosen (and correct) option after responding.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct response.","default":"true"},{"name":"correct_sound","type":"string","desc":"Optional sound URL overrides played on correct / incorrect responses (else win.mp3 / lose.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Optional sound URL overrides played on correct / incorrect responses (else win.mp3 / lose.mp3).","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the options box with CSS transform to fill the browser window.","default":"false"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from when the options are visible and the keyboard is live (after any preview / prompt lead time) to the keydown. The literature's \"response initiation time\"."},{"name":"response","type":"string","desc":"The key the participant pressed."},{"name":"key_hold_duration","type":"integer","desc":"How long (ms) the response key was held down: KeyDown -> KeyUp. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable (key never released, window blurred)."},{"name":"key_presses","type":"object []","desc":"Every key pressed from response onset until the response key is released (feedback time excluded): {key, t (ms from response onset), duration}. `duration` is null for a key still held when the window closed (it still counts for the multi-key exclusion)."},{"name":"multiple_keys_pressed","type":"boolean","desc":"True if a key other than the recorded response was also pressed (the standard RD exclusion criterion)."},{"name":"chosen_position","type":"integer","desc":"Left-to-right position chosen (0 = leftmost). Named to match wm-forced-choice."},{"name":"chosen_option","type":"integer","desc":"Canonical index (into `stimuli`) of the chosen option. Named to match wm-forced-choice."},{"name":"correct","type":"boolean","desc":"Whether the choice was correct (null if no correct_option given)."},{"name":"option_order","type":"integer []","desc":"Left-to-right order of stimulus indices as shown (matches wm-forced-choice)."},{"name":"stimuli","type":"string []","desc":"The option specs, in canonical order (as given)."},{"name":"stimuli_shown","type":"object []","desc":"Every option shown, in left-to-right order: {position, index (canonical), rotation (hue rotation applied, deg; always 0 for color and word options, which are never rotated)} plus {src} for an image, {text} for a word, or {value: the color spec as given}."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-continuous-report.js","global":"jsPsychContinuousReport","name":"continuous-report","desc":"Continuous report (delayed estimation). A memory array, a blank delay, then one location is probed and the participant reports the remembered feature on a wheel.","params":[{"name":"item_shape","type":"string","desc":"Item shape: \"disk\" (default), \"line\", \"triangle\", \"gabor\" (a sinusoidal grating under a circular Gaussian envelope) or \"grating\" (a sinusoidal grating in a circular aperture of item_size). Gabors and gratings are achromatic, set by `grating_options`; their stripes at orientation d run the same way as a \"line\" at d. \"line\", \"gabor\" and \"grating\" have a 180-degree orientation period.","default":"\"disk\""},{"name":"grating_options","type":"object","desc":"Gabor/grating appearance (item_shape \"gabor\" or \"grating\"; ignored otherwise). An object; keys you leave out keep their defaults: cycles (4): grating cycles across the item diameter; contrast (1): Michelson contrast 0..1 around the mean, capped so the sinusoid is not clipped (around a light mean such as the default #dddddd background only ~0.15 fits; use background_color \"#808080\" for full contrast); sigma (0.18): Gaussian envelope SD as a fraction of the item diameter (gabor only); phase (0): cosine phase in degrees at the item centre (0 = a bright stripe through the centre), or \"random\" for an independent whole-degree phase per drawn item (recorded in stimuli_shown and probe_phase); mean (\"background\"): the mean gray, \"background\" to match background_color's luminance so the patch blends into the box, or a CSS color (its luminance is used). Degree d and d + 180 draw the same pattern.","default":"{\"cycles\":4,\"contrast\":1,\"sigma\":0.18,\"phase\":0,\"mean\":\"background\"}"},{"name":"stimuli","type":"string []","desc":"Item colors. Each entry is a wheel degree (number) or a CSS / \"lab(...)\" string; only numeric degrees get a scored color error. One value colors every item the same (e.g. \"black\", \"gray\", a degree); a list gives per-item colors. Empty: random wheel colors when color is reported, else every item is `default_color`. Gabors and gratings ignore item colors.","default":"[]"},{"name":"orientations","type":"integer []","desc":"Item orientations in degrees (0 = pointing right / horizontal, increasing clockwise), for line/triangle/gabor/grating. One value = all the same; a list = per item; empty = random. Ignored for disks.","default":"[]"},{"name":"report","type":"string","desc":"What to report: \"color\", \"orientation\", or \"both\".","default":"\"color\""},{"name":"report_order","type":"string","desc":"For report:\"both\", which feature is reported first: \"color_first\" or \"orientation_first\".","default":"\"color_first\""},{"name":"default_color","type":"string","desc":"Color used when items have no color and color is not being reported.","default":"\"#666666\""},{"name":"line_width","type":"integer","desc":"Thickness (px) of line items. Triangles are filled and ignore it.","default":"10"},{"name":"orientation_period","type":"integer","desc":"Period (deg) for orientation error: 360 (a triangle has a pointing direction) or 180 (a line, Gabor or grating looks the same at t and t+180). 0 = auto by shape (line/gabor/grating -> 180, else 360; BradyUtils.shapePeriod).","default":"0"},{"name":"set_size","type":"integer","desc":"Number of items to auto-generate when nothing fixes the set size.","default":"3"},{"name":"min_color_distance","type":"integer","desc":"Min separation (deg) between auto-generated wheel colors.","default":"15"},{"name":"color_span","type":"integer","desc":"When auto-generating colors, confine them to a random arc this many degrees wide (360 = whole wheel). Use a narrow span (e.g. 90) for ensemble so the mean is meaningful.","default":"360"},{"name":"color_wheel","type":"object","desc":"Color wheel for degree lookups (defaults to window.BradyColorWheel).","default":"null"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"which_test","type":"integer","desc":"Index (0..set_size-1) of the probed item; -1 = ensemble (probe at the centre, target = circular mean of the numeric item colors). Ignored in perception mode.","default":"0"},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced locations items can occupy.","default":"8"},{"name":"radius","type":"integer","desc":"Radius (px) of the circle the items are arranged on.","default":"160"},{"name":"item_size","type":"integer","desc":"Diameter (px) of each item.","default":"90"},{"name":"num_choices","type":"integer","desc":"Number of options on the color wheel (>= 360 = continuous; e.g. 12 = quantized). A quantized grid sits at target + k*360/num_choices, so the target is always an option (with no single target it is anchored on the ensemble mean, else on 0).","default":"360"},{"name":"orientation_num_choices","type":"integer","desc":"Quantize the orientation response into this many steps around the full 360 deg (0 = continuous), anchored on the target orientation. For lines, Gabors and gratings, opposite steps look identical, so an even count gives half as many distinct orientations.","default":"0"},{"name":"spin_wheel","type":"boolean","desc":"Rotate the color wheel by a random whole-degree offset each trial (reduces motor bias; recorded as wheel_spin). The orientation response is never rotated.","default":"false"},{"name":"wheel_option_offset","type":"float","desc":"Constant angular offset (deg) applied to the color wheel option positions.","default":"0"},{"name":"responses_per_item","type":"integer","desc":"Number of responses to collect per reported dimension (>1 = ranking). Each rank must be a distinct option; capped at the option count of the dimension(s) reported. Orientations are compared within their period, so for lines, Gabors and gratings o and o+180 are the same option (an even orientation_num_choices gives n/2 distinct orientations).","default":"1"},{"name":"display_time","type":"integer","desc":"How long (ms) the memory array is shown.","default":"500"},{"name":"sequential","type":"boolean","desc":"Present the memory items one at a time in their placeholders (instead of all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms) before the probe/response. With mask_time > 0 it starts when the mask comes off, and still runs in full.","default":"800"},{"name":"precue_time","type":"integer","desc":"If > 0, highlight the to-be-probed location for this many ms; the array then follows after `delay_start`. Skipped in ensemble and perception (no single remembered location), and when do_test is false (no probe to cue).","default":"0"},{"name":"retrocue_time","type":"integer","desc":"If > 0, retro-cue: after the retention delay, highlight the to-be-probed location for this many ms before the response. 0 = off. Skipped in ensemble and perception.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. Not used in perception. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}).","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each item covered by the `noise_type` degradation (a transparent overlay, removed when the array is hidden). In perception mode the reference keeps its noise through the response and the gray match slot gets none.","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"cue_color","type":"string","desc":"Color of the pre-/retro-cue highlight ring (disk items; line/triangle keep the dot cue).","default":"\"#000\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the pre-/retro-cue highlight ring.","default":"5"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start to array onset.","default":"500"},{"name":"do_test","type":"boolean","desc":"If false, skip the test/response entirely (encoding-only trial).","default":"true"},{"name":"mode","type":"string","desc":"\"memory\" (items hidden, then report) or \"perception\": two slots, a visible reference (item 0) and a gray match slot (item 1) that the participant adjusts; no delay.","default":"\"memory\""},{"name":"feedback","type":"boolean","desc":"Show the correct answer and the error after responding (the first-ranked response when ranking). Not shown for ensemble.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct (small-error) response.","default":"true"},{"name":"feedback_threshold","type":"integer","desc":"Abs error (deg) at/under which a response counts \"correct\" for the reward cue.","default":"20"},{"name":"correct_sound","type":"string","desc":"Override URLs for the correct / incorrect sounds (else win.mp3 / lose.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URLs for the correct / incorrect sounds (else win.mp3 / lose.mp3).","default":"null"},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"#dddddd\""},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the stimulus box.","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"},{"name":"record_mouse","type":"boolean","desc":"Record the whole-trial mouse trajectory (off by default; no behavior change when off).","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between recorded mouse samples during non-response phases (0 = every event).","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between recorded mouse samples during the response phase (0 = every event).","default":"0"}],"data":[{"name":"rt","type":"integer []","desc":"Response time(s) (ms), in the order collected. Each is measured from the onset of its own report phase (color or orientation), so ranked responses are cumulative. The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer []","desc":"How long (ms) the mouse button was held for each committing click, in the same order as `rt`. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null for any click whose press could not be measured."},{"name":"error","type":"integer []","desc":"Color: signed error(s) in degrees (reported - target), wrapped to (-180,180]; null entries when the target has no numeric degree. For ensemble (which_test -1) the target is the circular mean of the item degrees (BradyUtils.ensembleTarget), so the error is reported - circular mean, as in continuous-image-report and continuous-object-report."},{"name":"reported_degree","type":"integer []","desc":"Color: reported color degree(s), in rank order."},{"name":"target_degree","type":"float","desc":"Color: target degree of the probed item (for ensemble, the circular mean of the item colors, which need not be a whole degree, so the type is FLOAT); null when there is no numeric color, or for an ensemble whose mean is undefined (the colors cancel out)."},{"name":"orientation_error","type":"integer []","desc":"Orientation: signed error(s) in degrees (reported - target), wrapped to (-period/2, period/2] with the orientation period (`orientation_period`: by default 180 for line, gabor and grating, else 360)."},{"name":"reported_orientation","type":"integer []","desc":"Orientation: reported orientation degree(s) in [0, orientation_period), in rank order. For a 180-period shape a pointer at 207 deg is recorded as 27."},{"name":"target_orientation","type":"integer","desc":"Orientation: target orientation of the probed item, in [0, orientation_period). null for ensemble, and for disks (which show no orientation)."},{"name":"orientation_period","type":"integer","desc":"The orientation period (deg) the orientation fields use: the orientation_period parameter when it is > 0, else 180 for line, gabor and grating and 360 for disk and triangle (BradyUtils.shapePeriod). Orientations are recorded in [0, period) and orientation errors wrap at +/- period/2."},{"name":"stimuli","type":"string []","desc":"Item color specs presented (in perception mode, entry 1 is the gray match slot)."},{"name":"orientations","type":"integer []","desc":"Item orientations presented (deg), in [0, orientation_period). null for disks, which show no orientation."},{"name":"positions","type":"integer []","desc":"Placeholder index of each presented item."},{"name":"which_test","type":"integer","desc":"Index of the probed item after clamping (-1 = ensemble; 1 = the match slot in perception mode, whose target is the reference, item 0)."},{"name":"wheel_spin","type":"integer","desc":"Random color-wheel rotation (deg) applied this trial (0 unless spin_wheel)."},{"name":"actual_stim_duration","type":"integer","desc":"Measured ms from the first item painted to the array being hidden (for sequential presentation this spans the whole sequence, gaps included)."},{"name":"set_size","type":"integer","desc":"Number of items in the memory array."},{"name":"report","type":"string","desc":"What was reported (\"color\", \"orientation\", or \"both\")."},{"name":"item_shape","type":"string","desc":"Item shape used (\"disk\", \"line\", \"triangle\", \"gabor\", or \"grating\")."},{"name":"num_choices","type":"integer","desc":"Number of options on the color wheel."},{"name":"stimuli_shown","type":"object []","desc":"Every item presented: per-item {position, color, orientation, degree}; `degree` only when the color is a numeric wheel degree. `orientation` is in [0, orientation_period), or null for disks. Gabors and gratings are achromatic, so their `color` is null; they also carry `phase`, the grating phase (deg) the item was drawn with (grating_options.phase, or its own draw when that is \"random\")."},{"name":"target_index","type":"integer","desc":"Index into stimuli_shown / item arrays of the probed item (-1 = ensemble)."},{"name":"probe_phase","type":"float","desc":"Gabor/grating only (absent for other shapes): the phase (deg) of the probe drawn during the response and feedback. It is drawn on its own when grating_options.phase is \"random\", so it generally differs from the probed item's study phase. In perception mode the match slot is the probe, so it equals stimuli_shown[1].phase."},{"name":"mouse_trajectory","type":"object []","desc":"Recorded mouse trajectory samples (only when record_mouse)."},{"name":"mouse_trajectory_columns","type":"string []","desc":"Column names for each mouse_trajectory sample (only when record_mouse)."},{"name":"mouse_response_start_index","type":"integer","desc":"Index of the first mouse sample in the response phase (only when record_mouse)."},{"name":"mouse_phase_onsets","type":"object","desc":"Only when record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at the fixation click, or at trial start when click_to_start is false). encoding: 0, tracking start, which comes before delay_start and any pre-cue; array: the memory array's onset (first item painted); mask: the mask's onset, which is the array's offset (only on trials that show a mask); delay: the blank retention interval begins, at the array's offset or, after a mask, at the mask's offset (absent in perception mode); report: the response phase opens. Any retro-cue falls between delay and report."},{"name":"mouse_zoom","type":"float","desc":"Zoom factor applied to the box, for unscaling mouse coordinates (only when record_mouse)."},{"name":"mouse_geometry","type":"object","desc":"Layout geometry in the mouse-trajectory frame (only when record_mouse): item study boxes (top-left x,y and w,h), wheel centre/radius, each item's wheel point, and the target point. `dimension` says which wheel is described: the color wheel, or the orientation circle for report:\"orientation\". Points are null for items without a numeric value."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-continuous-image-report.js","global":"jsPsychContinuousImageReport","name":"continuous-image-report","desc":"Continuous image report: delayed estimation on a circular morph wheel (faces, objects, any morph circle). The image counterpart of jspsych-continuous-report.js, which does color.","params":[{"name":"image_sprite","type":"image","desc":"URL of the morph sprite: one horizontal strip of `num_frames` equal-width frames, frame 0 at the left.","default":"null"},{"name":"num_frames","type":"integer","desc":"Number of frames in the sprite strip (the morph-circle resolution). Degree d shows frame round(d/360 * num_frames) mod num_frames.","default":"360"},{"name":"frames","type":"image []","desc":"Alternative to `image_sprite`: an array of image URLs, one per morph step. If non-empty it overrides the sprite and `num_frames` (the frame count becomes the array length).","default":"[]"},{"name":"item_values","type":"integer []","desc":"Item morph values as wheel degrees (0..359). If empty, `set_size` random morph degrees at least `min_color_distance` apart are generated.","default":"[]"},{"name":"set_size","type":"integer","desc":"Number of items to auto-generate when `item_values` is empty.","default":"3"},{"name":"min_color_distance","type":"integer","desc":"Min separation (deg) between auto-generated morph degrees.","default":"15"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"which_test","type":"integer","desc":"Index (0..set_size-1) of the probed item; -1 = probe at center (ensemble: the target is the circular mean of the item degrees).","default":"0"},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced locations items can occupy.","default":"8"},{"name":"radius","type":"integer","desc":"Radius (px) of the circle the items are arranged on.","default":"160"},{"name":"item_size","type":"integer","desc":"Diameter (px) of each item.","default":"90"},{"name":"num_choices","type":"integer","desc":"Number of options on the response wheel (360 = one per degree; e.g. 12 = quantized). Options sit at target - k*360/num_choices, so the target is always an option (for ensemble the target is the circular mean; anchored on 0 only when that mean is undefined). Independent of num_frames.","default":"360"},{"name":"num_previews","type":"integer","desc":"Number of preview thumbnails shown outside the wheel (0 = none).","default":"24"},{"name":"spin_wheel","type":"boolean","desc":"Rotate the response wheel by a random whole-degree offset each trial (reduces motor bias; recorded as wheel_spin).","default":"false"},{"name":"wheel_option_offset","type":"float","desc":"Constant angular offset (deg) applied to the wheel option positions.","default":"0"},{"name":"responses_per_item","type":"integer","desc":"Number of responses to collect per item (>1 = ranking). Each rank must be a distinct option, so it is capped at num_choices.","default":"1"},{"name":"display_time","type":"integer","desc":"How long (ms) the memory array is shown (0 = never shown). Ignored when sequential.","default":"500"},{"name":"sequential","type":"boolean","desc":"Present the memory items one at a time in their placeholders (instead of all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms) before the probe/response wheel. With mask_time > 0 it starts when the mask comes off, and still runs in full.","default":"800"},{"name":"precue_time","type":"integer","desc":"If > 0, highlight the to-be-probed location for this many ms; the array then follows after `delay_start`. Skipped in ensemble and perception, and when do_test is false (no probe to cue).","default":"0"},{"name":"retrocue_time","type":"integer","desc":"If > 0, retro-cue: after the retention delay, highlight the to-be-probed location for this many ms before the response wheel. 0 = off. Skipped in ensemble and perception.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. Not used in perception. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}).","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each item covered by the `noise_type` degradation (a transparent overlay, removed when the array is hidden; in perception it stays for the whole trial). The centre probe is never noisy.","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"cue_color","type":"string","desc":"Color of the pre-/retro-cue highlight ring.","default":"\"#000\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the pre-/retro-cue highlight ring.","default":"5"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start to array onset.","default":"500"},{"name":"do_test","type":"boolean","desc":"If false, skip the test/response entirely (encoding-only trial).","default":"true"},{"name":"feedback","type":"boolean","desc":"Show the correct morph and the error after responding (ranking: the correct morph only; the reward cue scores the first-ranked response). Not shown for ensemble.","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct (small-error) response.","default":"true"},{"name":"feedback_threshold","type":"integer","desc":"Abs error (deg) at/under which a response counts \"correct\" for the reward cue.","default":"20"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"mode","type":"string","desc":"\"memory\" (array, delay, then the probed location) or \"perception\" (array stays up, no delay, and the response is made on a centre probe).","default":"\"memory\""},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"#ffffff\""},{"name":"start_text","type":"string","desc":"Text shown on the fixation while waiting to start the trial.","default":"\"Click the + to start this trial.\""},{"name":"prompt","type":"HTML string","desc":"Optional HTML prompt shown beneath the stimulus box.","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"},{"name":"record_mouse","type":"boolean","desc":"Record the whole-trial mouse trajectory (off by default; no behavior change when off).","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between recorded mouse samples during non-response phases (0 = every event).","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between recorded mouse samples during the response phase (0 = every event).","default":"0"}],"data":[{"name":"rt","type":"integer []","desc":"Response time(s) (ms) from wheel onset to each click. The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer []","desc":"How long (ms) the mouse button was held for each committing click, in the same order as `rt`. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null for any click whose press could not be measured."},{"name":"error","type":"integer []","desc":"Signed error(s) in degrees (reported - target), wrapped to (-180,180] and rounded. For ensemble the target is the circular mean of the item degrees, so the error is reported - circular mean (BradyUtils.ensembleTarget, as in continuous-report); null only when that mean is undefined (the degrees cancel out)."},{"name":"reported_degree","type":"float []","desc":"Reported morph degree(s): the option chosen on the wheel, in rank order. FLOAT: not a whole degree when 360/num_choices isn't one (e.g. num_choices 7); not rounded."},{"name":"reported_frame","type":"integer []","desc":"Frame index shown for each reported degree (into the sprite strip or `frames`)."},{"name":"target_degree","type":"float","desc":"Target morph degree of the probed item; for ensemble, the circular mean of the item degrees (FLOAT: need not be a whole degree), or null if that mean is undefined."},{"name":"target_frame","type":"integer","desc":"Frame index of the probed item (for ensemble, the frame nearest the circular mean; null if that mean is undefined)."},{"name":"stimuli","type":"integer []","desc":"Item morph degrees presented."},{"name":"positions","type":"integer []","desc":"Placeholder index of each presented item."},{"name":"which_test","type":"integer","desc":"Index of the probed item (-1 = ensemble/center)."},{"name":"set_size","type":"integer","desc":"Number of items in the array."},{"name":"wheel_spin","type":"integer","desc":"Random wheel rotation (deg) applied this trial."},{"name":"num_choices","type":"integer","desc":"Number of options that appeared on the response wheel."},{"name":"mode","type":"string","desc":"\"memory\" or \"perception\"."},{"name":"actual_stim_duration","type":"integer","desc":"Measured ms from the first item painted to the array being hidden (sequential: the whole sequence, gaps included). In perception the array is never hidden, so it is the time from array onset to the (last) response click; about 0 with do_test:false, and null when nothing was shown (display_time 0)."},{"name":"stimuli_shown","type":"object []","desc":"Every item presented: per-item {position, degree, frame}, plus `src` when `frames` is used."},{"name":"target_index","type":"integer","desc":"Index into stimuli_shown / item arrays of the probed item (-1 = ensemble)."},{"name":"mouse_trajectory","type":"object []","desc":"Recorded mouse trajectory samples (only when record_mouse)."},{"name":"mouse_trajectory_columns","type":"string []","desc":"Column names for each mouse_trajectory sample (only when record_mouse)."},{"name":"mouse_response_start_index","type":"integer","desc":"Index of the first mouse sample in the response phase (only when record_mouse)."},{"name":"mouse_phase_onsets","type":"object","desc":"Only when record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at the fixation click, or at trial start when click_to_start is false). encoding: 0, tracking start, which comes before any pre-cue and delay_start; array: the memory array's onset (first item painted); mask: the mask's onset, which is the array's offset (only on trials that show a mask); delay: the blank retention interval begins, at the array's offset or, after a mask, at the mask's offset (absent in perception mode, where the array stays up); report: the wheel appears. Any retro-cue falls between delay and report."},{"name":"mouse_zoom","type":"float","desc":"Zoom factor applied to the box, for unscaling mouse coordinates (only when record_mouse)."},{"name":"mouse_geometry","type":"object","desc":"Layout geometry in the mouse-trajectory frame (only when record_mouse): item study boxes (top-left x,y and w,h), wheel centre/radius, each item's wheel point, and the target point (for ensemble, the circular mean of the item degrees; null if that is undefined)."}]},{"file":"jspsych-continuous-object-report.js","global":"jsPsychContinuousObjectReport","name":"continuous-object-report","desc":"Continuous object-color report: delayed estimation with real-object photos, the multi-item working-memory version of color-rotated-object's report mode. Each photo in the memory array is hue-rotated in CIELAB by a per-item amount (its \"color\").","params":[{"name":"object_image","type":"image","desc":"One object photo used for every item that `stimuli` doesn't cover.","default":"null"},{"name":"stimuli","type":"image []","desc":"Per-item object photo URLs. Entry i overrides `object_image` for item i.","default":"[]"},{"name":"item_colors","type":"integer []","desc":"Per-item hue rotations (degrees) applied in CIELAB: the items' \"colors\". If empty, `set_size` rotations at least `min_color_distance` deg apart are generated. Error is scored against these.","default":"[]"},{"name":"set_size","type":"integer","desc":"Number of items when neither `item_colors` nor `stimuli` fixes the count.","default":"3"},{"name":"min_color_distance","type":"integer","desc":"Min separation (deg) between auto-generated item hue rotations.","default":"20"},{"name":"num_placeholders","type":"integer","desc":"Number of equally-spaced locations items can occupy.","default":"8"},{"name":"radius","type":"integer","desc":"Radius (px) of the circle the items are arranged on.","default":"160"},{"name":"item_size","type":"integer","desc":"Diameter (px) of each item (used for both width & height unless overridden).","default":"100"},{"name":"stimulus_width","type":"integer","desc":"Item width (px); falls back to `item_size`.","default":"null"},{"name":"stimulus_height","type":"integer","desc":"Item height (px); falls back to `item_size`.","default":"null"},{"name":"item_positions","type":"integer []","desc":"Optional explicit placeholder index for each item (else random). Invalid slots (negative or non-integer) and repeated slots are dropped, entries past set_size are ignored, and items left without a slot go to random unused placeholders (BradyUtils.resolvePositions). num_placeholders grows to cover the largest slot used.","default":"[]"},{"name":"which_test","type":"integer","desc":"Index (0..set_size-1) of the probed item; -1 = ensemble/center probe (the target is the circular mean of the item hues).","default":"0"},{"name":"num_choices","type":"integer","desc":"Number of options around the wheel (>= 360 = one per 360/num_choices deg from 0; e.g. 12 = quantized). A quantized grid sits at target + k*360/num_choices, so the target is always an option (for ensemble the target is the circular mean; the grid starts at 0 only when that mean is undefined).","default":"360"},{"name":"choice_degrees","type":"integer []","desc":"Explicit list of option degrees (0..359) to show; overrides `num_choices` if non-empty. Not anchored on the target, so the target may not be an option.","default":"[]"},{"name":"spin_wheel","type":"boolean","desc":"Rotate the whole wheel by a random whole-degree offset each trial (reduces spatial/motor bias; recorded as wheel_spin).","default":"false"},{"name":"wheel_option_offset","type":"float","desc":"Constant angular offset (deg) applied to the wheel option positions.","default":"0"},{"name":"responses_per_item","type":"integer","desc":"Responses to collect per item (>1 = ranking). Each rank must be a distinct option, so it is capped at the number of options.","default":"1"},{"name":"wheel_shows_object","type":"boolean","desc":"If true, each ring option is a small canvas showing the probed object recolored to that option's hue rotation. If false, options are plain swatches (gray, or see `wheel_colors`).","default":"false"},{"name":"wheel_colors","type":"boolean","desc":"If true, color the ring options with the probed object's own hues: its mean chromatic CIELAB color rotated to each option's degree, so degree 0 is the object's unrotated mean color rather than the color wheel's degree 0. Falls back to the color_wheel / BradyColorWheel spectrum if the photo's pixels can't be read (missing or cross-origin). Ignored when wheel_shows_object is true.","default":"false"},{"name":"cue_items","type":"boolean","desc":"If true, outline the probed item's location for as long as the array is shown.","default":"false"},{"name":"precue_time","type":"integer","desc":"If > 0, highlight the to-be-probed location for this many ms; the array then follows after `delay_start`. Skipped in ensemble, and when do_test is false (no probe to cue).","default":"0"},{"name":"retrocue_time","type":"integer","desc":"If > 0, retro-cue: after the retention delay, highlight the to-be-probed location for this many ms before the response wheel. 0 = off. Skipped in ensemble.","default":"0"},{"name":"mask_time","type":"integer","desc":"If > 0, cover the occupied locations with a `mask_type` mask for this many ms starting the moment the array goes off (a backward mask that cuts encoding off); the blank `delay_time` then runs in full. 0 = off.","default":"0"},{"name":"mask_type","type":"string","desc":"Mask kind: a key in BradyUtils.maskKinds (\"color-squares\", \"noise\", \"scramble\"; extend with BradyUtils.registerMask) or a function(ctx, size, {wheel, rng}).","default":"\"color-squares\""},{"name":"noise_level","type":"float","desc":"Stimulus noise at encoding: 0 = none; 0..1 = fraction of each item covered by the `noise_type` degradation (a transparent overlay, removed when the array is hidden).","default":"0"},{"name":"noise_type","type":"string","desc":"Noise kind: a key in BradyUtils.noiseKinds (\"speckle\", \"salt-pepper\", \"gaussian\"; extend with BradyUtils.registerNoise) or a function(ctx, size, level, {wheel, rng}).","default":"\"speckle\""},{"name":"cue_color","type":"string","desc":"Color of the pre-/retro-cue highlight ring.","default":"\"#000\""},{"name":"cue_thickness","type":"integer","desc":"Thickness (px) of the pre-/retro-cue highlight ring.","default":"5"},{"name":"display_time","type":"integer","desc":"How long (ms) the memory array is shown.","default":"500"},{"name":"sequential","type":"boolean","desc":"Present the memory items one at a time in their placeholders (instead of all at once).","default":"false"},{"name":"sequential_item_time","type":"integer","desc":"When sequential: how long (ms) each item is shown.","default":"300"},{"name":"sequential_gap_time","type":"integer","desc":"When sequential: blank gap (ms) between successive items.","default":"300"},{"name":"sequential_cumulative","type":"boolean","desc":"When sequential: keep each item visible (build up) instead of blanking each before the next.","default":"false"},{"name":"delay_time","type":"integer","desc":"Blank retention interval (ms) before the probe/response wheel. With mask_time > 0 it starts when the mask comes off, and still runs in full.","default":"800"},{"name":"delay_start","type":"integer","desc":"Delay (ms) from start to array onset.","default":"500"},{"name":"click_to_start","type":"boolean","desc":"Wait for a click on the fixation \"+\" before starting (vs. a timer).","default":"true"},{"name":"do_test","type":"boolean","desc":"If false, skip the test/response entirely (encoding-only trial).","default":"true"},{"name":"feedback","type":"boolean","desc":"After the final response, show the true color and the error of the first-ranked response. Not shown for ensemble.","default":"false"},{"name":"feedback_threshold","type":"integer","desc":"Absolute error (deg) at/under which a response counts as \"correct\" for feedback cues.","default":"20"},{"name":"feedback_sound","type":"boolean","desc":"Play win/lose sound on feedback (via U.feedbackCues).","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct (small-error) response.","default":"true"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound.","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound.","default":"null"},{"name":"placeholder_border","type":"string","desc":"CSS border on every placeholder location (\"none\" = invisible); defaults to a visible box to show the spatial layout.","default":"\"2px solid #ccc\""},{"name":"background_color","type":"string","desc":"Background color of the stimulus box.","default":"\"#dddddd\""},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the box.","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"},{"name":"color_wheel","type":"object","desc":"Color wheel (default window.BradyColorWheel). Not the reported dimension, which is hue rotation; used only for the wheel_colors fallback and color-based noise/mask kinds.","default":"null"},{"name":"record_mouse","type":"boolean","desc":"If true, record the mouse trajectory for the whole trial (see U.makeMouseTracker).","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between recorded samples before the report phase (0 = keep every move).","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between recorded samples during the report phase (0 = keep every move).","default":"0"}],"data":[{"name":"rt","type":"integer []","desc":"Response time(s) (ms) from wheel onset to each click. The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer []","desc":"How long (ms) the mouse button was held for each committing click, in the same order as `rt`. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null for any click whose press could not be measured."},{"name":"error","type":"integer []","desc":"Signed error(s) in degrees (reported - target), wrapped to (-180,180] and rounded. For ensemble the target is the circular mean of the item hues, so the error is reported - circular mean (BradyUtils.ensembleTarget, as in continuous-report); null only when that mean is undefined (the hues cancel out)."},{"name":"reported_degree","type":"float []","desc":"Reported hue rotation(s) (deg), in rank order: the option nearest the pointer at each click, so clicking the target option scores 0 error. Same values as reported_option. FLOAT: not a whole degree when 360/num_choices isn't one; not rounded."},{"name":"reported_option","type":"float []","desc":"The option degree(s) chosen (FLOAT, like reported_degree)."},{"name":"target_degree","type":"float","desc":"True hue rotation (deg) of the probed item; for ensemble, the circular mean of the item hues (FLOAT: need not be a whole degree), or null if that mean is undefined."},{"name":"item_colors","type":"integer []","desc":"Per-item hue rotations (deg) presented."},{"name":"stimuli","type":"string []","desc":"Object photo URL used for each item."},{"name":"positions","type":"integer []","desc":"Placeholder index of each presented item."},{"name":"which_test","type":"integer","desc":"Index of the probed item (-1 = ensemble)."},{"name":"wheel_spin","type":"integer","desc":"Random wheel rotation (deg) applied this trial."},{"name":"set_size","type":"integer","desc":"Number of items in the memory array."},{"name":"num_choices","type":"integer","desc":"Number of options that were on the wheel."},{"name":"actual_stim_duration","type":"integer","desc":"Measured ms from the first item painted to the array being hidden (sequential: the whole sequence, gaps included)."},{"name":"stimuli_shown","type":"object []","desc":"Every item presented: per-item {position, src, degree}."},{"name":"target_index","type":"integer","desc":"Index into stimuli_shown / item arrays of the probed item (-1 = ensemble)."},{"name":"mouse_trajectory","type":"object []","desc":"Recorded mouse trajectory samples (only when record_mouse)."},{"name":"mouse_trajectory_columns","type":"string []","desc":"Column names for each mouse_trajectory sample (only when record_mouse)."},{"name":"mouse_response_start_index","type":"integer","desc":"Index of the first mouse sample in the response phase (only when record_mouse)."},{"name":"mouse_phase_onsets","type":"object","desc":"Only when record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at the fixation click, or at trial start when click_to_start is false). encoding: 0, tracking start, which comes before any pre-cue and delay_start; array: the memory array's onset (first item painted); mask: the mask's onset, which is the array's offset (only on trials that show a mask); delay: the blank retention interval begins, at the array's offset or, after a mask, at the mask's offset; report: the probe and wheel appear. Any retro-cue falls between delay and report."},{"name":"mouse_zoom","type":"float","desc":"Zoom factor applied to the box, for unscaling mouse coordinates (only when record_mouse)."},{"name":"mouse_geometry","type":"object","desc":"Layout geometry in the mouse-trajectory frame (only when record_mouse): item study boxes (top-left x,y and w,h), wheel centre/radius, each item's wheel point, and the target point (for ensemble, the circular mean of the item hues)."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-color-rotated-object.js","global":"jsPsychColorRotatedObject","name":"color-rotated-object","desc":"Shows a single object image with its hue rotated in CIELAB space, for \"what is the real color of this object?\" tasks.","params":[{"name":"stimulus","type":"image","desc":"Image URL of the object to display.","default":""},{"name":"color_rotation_deg","type":"integer","desc":"Hue rotation (degrees) applied to the object in CIELAB space. - display mode: the rotation applied to the shown image (null/0 = none). - report mode: the true rotation the response is scored against. If given, signed `error` (reported - target) is recorded and a quantized ring is anchored on it; if null, `error` entries are null.","default":"null"},{"name":"stimulus_width","type":"integer","desc":"Image width (px). Falls back to the image's natural width if null.","default":"null"},{"name":"stimulus_height","type":"integer","desc":"Image height (px). Falls back to the image's natural height if null.","default":"null"},{"name":"mode","type":"string","desc":"Which behavior to run: \"display\" (study/present) or \"report\" (adjust on wheel).","default":"\"display\""},{"name":"prompt","type":"HTML string","desc":"Optional HTML shown beneath the stimulus.","default":"null"},{"name":"auto_zoom","type":"boolean","desc":"Scale the stimulus box with CSS transform to fill the browser window.","default":"false"},{"name":"choices","type":"keys","desc":"Keys allowed to respond (\"ALL_KEYS\", \"NO_KEYS\", or an array like [\"f\",\"j\"]).","default":"\"ALL_KEYS\""},{"name":"response_ends_trial","type":"boolean","desc":"If true, any valid keypress ends the trial.","default":"true"},{"name":"stimulus_duration","type":"integer","desc":"How long (ms) until the stimulus is hidden (null = stays visible).","default":"null"},{"name":"trial_duration","type":"integer","desc":"How long (ms) until the trial ends on its own (null = wait for response). With choices \"NO_KEYS\" or response_ends_trial false, set this: otherwise the trial never ends (a console warning says so).","default":"null"},{"name":"num_choices","type":"integer","desc":"Number of options around the ring (360 = one per degree). Below 360 the grid is anchored on color_rotation_deg, so the target is always an option; with no target it starts at 0. Ignored when choice_degrees is given.","default":"360"},{"name":"choice_degrees","type":"integer []","desc":"Explicit list of option degrees (0..359) to show; overrides num_choices if non-empty.","default":"[]"},{"name":"num_previews","type":"integer","desc":"Number of recolored object previews shown outside the ring (0 = none). Display only: not clickable, no effect on scoring. Each preview fits the object into a 75x75 square at its own aspect ratio.","default":"24"},{"name":"spin_wheel","type":"boolean","desc":"Rotate the whole ring by a random 0-359 deg each trial, so a hue has no fixed screen position.","default":"false"},{"name":"responses_per_item","type":"integer","desc":"Responses to collect per item (>1 = ranking task).","default":"1"},{"name":"background_color","type":"string","desc":"Background color of the report box.","default":"\"#ffffff\""},{"name":"feedback","type":"boolean","desc":"After the final response, show the true color and the error for 1200 ms (needs color_rotation_deg).","default":"false"},{"name":"feedback_sound","type":"boolean","desc":"Play a win/lose sound on feedback.","default":"true"},{"name":"feedback_confetti","type":"boolean","desc":"Fire a confetti burst on a correct (small-error) response.","default":"true"},{"name":"feedback_threshold","type":"integer","desc":"Abs error (deg) at/under which a report counts \"correct\" for the reward cue.","default":"20"},{"name":"correct_sound","type":"string","desc":"Override URL for the correct-response sound (else win.mp3).","default":"null"},{"name":"incorrect_sound","type":"string","desc":"Override URL for the incorrect-response sound (else lose.mp3).","default":"null"},{"name":"color_wheel","type":"object","desc":"Color wheel object (default window.BradyColorWheel). Only used for the swatch colors when wheel_colors is on and the image's own colors can't be read (cross-origin).","default":"null"},{"name":"wheel_colors","type":"boolean","desc":"If true, color each ring swatch with the object's own mean chromatic CIELAB color rotated to that option's degree, instead of plain gray. Degree 0 is then the object's unrotated color, not the color wheel's degree 0. Falls back to the color_wheel spectrum if the image can't be read (cross-origin).","default":"false"},{"name":"record_mouse","type":"boolean","desc":"If true, record the mouse trajectory from stimulus onset to the end of the trial (see U.makeMouseTracker).","default":"false"},{"name":"mouse_min_interval","type":"integer","desc":"Min ms between recorded samples in display mode (0 = keep every move).","default":"0"},{"name":"mouse_response_min_interval","type":"integer","desc":"Min ms between recorded samples in report mode (0 = keep every move).","default":"0"}],"data":[{"name":"mode","type":"string","desc":"Which mode ran (\"display\" | \"report\")."},{"name":"stimulus","type":"string","desc":"Stimulus image URL."},{"name":"color_rotation_deg","type":"integer","desc":"Applied/true hue rotation (deg) for this trial."},{"name":"rt","type":"integer []","desc":"Response times (ms): in report mode one per response, from report onset; in display mode a length-1 array from stimulus onset ([null] if no key). The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer []","desc":"report: how long (ms) the mouse button was held for each committing click, parallel to `rt`. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. An entry is null if that press could not be measured; the whole field is null in display mode."},{"name":"response","type":"string","desc":"display: the key pressed (null if none)."},{"name":"key_hold_duration","type":"integer []","desc":"display: how long (ms) the response key was held down (KeyDown to KeyUp), as a length-1 array parallel to `rt`. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable (no key, key never released, window blurred) and in report mode."},{"name":"key_presses","type":"object []","desc":"display: every key released during the trial: {key, t (ms from response onset), duration}."},{"name":"multiple_keys_pressed","type":"boolean","desc":"display: true if a key other than the recorded response was also pressed (the standard RD exclusion criterion). Always false in report mode."},{"name":"reported_degree","type":"float []","desc":"report: reported hue rotation(s) (deg, [0,360)): the ring option nearest the click, which is the hue the object showed at that moment. Can be fractional (a num_choices that doesn't divide 360, or fractional choice_degrees)."},{"name":"reported_option","type":"float []","desc":"report: the ring option degree(s) committed (FLOAT, like reported_degree). Same values as reported_degree."},{"name":"physical_angle","type":"integer []","desc":"report: raw on-screen pointer angle(s) at the click (deg, 0 = right, clockwise), before removing the wheel spin."},{"name":"error","type":"integer []","desc":"report: signed error(s) (reported - target) in (-180,180], rounded; null entries if color_rotation_deg is null."},{"name":"wheel_spin","type":"integer","desc":"report: random ring rotation (deg) applied this trial (0 unless spin_wheel)."},{"name":"num_options","type":"integer","desc":"report: number of options that were on the ring."},{"name":"actual_stim_duration","type":"integer","desc":"display: measured ms the object was on screen (report mode: null)."},{"name":"stimuli_shown","type":"object []","desc":"Array (length 1) describing the shown object: its value (image src) and applied/true hue rotation."},{"name":"target_index","type":"integer","desc":"Index into stimuli_shown of the shown object (always 0)."},{"name":"mouse_trajectory","type":"object []","desc":"record_mouse: recorded mouse samples, each a [t, x, y, value] row (see mouse_trajectory_columns)."},{"name":"mouse_trajectory_columns","type":"string []","desc":"record_mouse: column names for each mouse_trajectory row."},{"name":"mouse_response_start_index","type":"integer","desc":"record_mouse: index into mouse_trajectory of the first report-phase sample (report mode)."},{"name":"mouse_phase_onsets","type":"object","desc":"record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at stimulus onset; no fixation click). Study mode: encoding and array, both 0 (tracking starts when the object appears). Report mode: report, 0 (tracking starts when the object and wheel appear)."},{"name":"mouse_zoom","type":"float","desc":"record_mouse: CSS zoom/scale factor applied to the box when sampling (for un-zooming coords)."},{"name":"mouse_geometry","type":"object","desc":"record_mouse: layout in the mouse-trajectory frame (logical px from the box centre): the object's box and, in report mode, the ring centre/radius and the target's point on it (null when there is no target)."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-wm-forced-choice.js","global":"jsPsychWmForcedChoice","name":"wm-forced-choice","desc":"Working-memory n-alternative forced choice (the forced-choice analog of change detection). Shows a memory array, a blank retention delay, then probes one location and presents K options; the participant picks the option that matches the probed item.","params":[{"name":"stimuli","type":"string []","desc":"The memory-array items. Each entry may be a number (degree on the color wheel), a CSS color / \"lab(L,a,b)\" string, an image path, or a text/word. If empty, `set_size` random wheel colors (>= `min_color_distance` apart) are generated.","default":"[]"},{"name":"item_type","type":"string","desc":"Force interpretation of items: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"item_shape","type":"string","desc":"Shape of color items: \"disk\" (default) or \"square\", a filled square the size of the disk (the Luck & Vogel style display), for the memory items, their placeholders and the color options. Cue rings and noise/mask overlays follow it. Image and text items are always square.","default":"\"disk\""},{"name":"color_wheel","type":"object","desc":"Color wheel for degree lookups (defaults to window.BradyColorWheel).","default":"null"},{"name":"set_size","type":"integer","desc":"Number of items to auto-generate when `stimuli` is empty (at least 1 is generated).","default":"3"},{"name":"min_color_distance","type":"integer","desc":"Min separation (deg) between auto-generated wheel colors, and between generated distractors and the target / each other. For distractors, values below 1 count as 1, so a distractor never duplicates the target."
