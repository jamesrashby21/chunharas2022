ot measurable."},{"name":"actual_stim_duration","type":"integer","desc":"Measured ms the memory array was actually on screen (onset to hide)."},{"name":"stimuli_shown","type":"object []","desc":"One entry per presented item: placeholder index, pixel centre (x,y, from the box's top-left), value (image src) and orientation (in [0, orientation_period))."},{"name":"target_index","type":"integer","desc":"Index into stimuli_shown of the probed item (= which_test)."},{"name":"target_value","type":"string","desc":"Image src of the probed object."},{"name":"mouse_trajectory","type":"object []","desc":"record_mouse: recorded mouse samples, each a [t, x, y, value] row (see mouse_trajectory_columns)."},{"name":"mouse_trajectory_columns","type":"string []","desc":"record_mouse: column names for each mouse_trajectory row."},{"name":"mouse_response_start_index","type":"integer","desc":"record_mouse: index into mouse_trajectory of the first report-phase sample."},{"name":"mouse_phase_onsets","type":"object","desc":"record_mouse: phase name -> onset (ms), on the trajectory's clock (t = 0 at the fixation click, or at trial start when click_to_start is false). encoding: 0, tracking start, which comes before any pre-cue and delay_start; array: the memory array's onset; mask: the mask's onset, which is the array's offset (only on trials that show a mask); delay: the blank retention interval begins, at the array's offset or, after a mask, at the mask's offset; report: the probe appears. Any retro-cue falls between delay and report."},{"name":"mouse_zoom","type":"float","desc":"record_mouse: CSS zoom/scale factor applied to the box when sampling (for un-zooming coords)."},{"name":"mouse_geometry","type":"object","desc":"record_mouse: layout in the mouse-trajectory frame (logical px from the box centre): item boxes, the dashed guide ring the object spins inside (centre + radius), each item's orientation as a point on that ring, and the target's point."}]},{"file":"jspsych-similarity-triad.js","global":"jsPsychSimilarityTriad","name":"similarity-triad","desc":"Similarity triad: three items, and the participant clicks the one that is MOST DIFFERENT. The responses feed BradySimilarity, which estimates the similarity structure of a stimulus wheel.","params":[{"name":"stimuli","type":"string []","desc":"The 3 items, [top/reference, bottom-left, bottom-right] in both layouts. Each may be a number (color-wheel degree, or orientation degree when `item_shape` is \"line\"/\"triangle\"/\"gabor\"/\"grating\"), a CSS color / \"lab(...)\" string, an image path, or text. Numbers are recorded wrapped into [0, period), so a \"line\" at 200 is recorded (and drawn) as 20. Leave empty to draw from `engine` instead (adaptive mode).","default":"[]"},{"name":"layout","type":"string","desc":"Task layout: \"reference\" (default, reference-on-top 2AFC) or \"triangle\" (odd-one-out).","default":"\"reference\""},{"name":"item_type","type":"string","desc":"Force interpretation of items: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"item_shape","type":"string","desc":"Item shape: \"disk\" (default; a numeric item is a color-wheel hue), or \"line\" / \"triangle\" / \"gabor\" / \"grating\" (a numeric item is an orientation in degrees; 0 = horizontal / pointing right, increasing clockwise). Lines and triangles are drawn in `item_color`; Gabors and gratings are achromatic, set by `grating_options`, with stripes at d running the same way as a \"line\" at d. \"line\", \"gabor\" and \"grating\" repeat every 180 degrees (period 180); \"disk\" and \"triangle\" repeat every 360.","default":"\"disk\""},{"name":"item_color","type":"string","desc":"Fill color for \"line\"/\"triangle\" (orientation/shape) items. Gabors and gratings are achromatic and ignore it.","default":"\"#555555\""},{"name":"grating_options","type":"object","desc":"Gabor/grating appearance (item_shape \"gabor\" or \"grating\"; ignored otherwise). An object; keys you leave out keep their defaults: cycles (4): grating cycles across the item diameter; contrast (1): Michelson contrast 0..1 around the mean, capped so the sinusoid is not clipped (around a light mean such as the default #dddddd background only ~0.15 fits; use background_color \"#808080\" for full contrast); sigma (0.18): Gaussian envelope SD as a fraction of the item diameter (gabor only); phase (0): cosine phase in degrees at the item centre (0 = a bright stripe through the centre), or \"random\" for an independent whole-degree phase per item (recorded in stimuli_shown); mean (\"background\"): the mean gray, \"background\" to match background_color's luminance so the patch blends into the box, or a CSS color (its luminance is used). Degree d and d + 180 draw the same pattern.","default":"{\"cycles\":4,\"contrast\":1,\"sigma\":0.18,\"phase\":0,\"mean\":\"background\"}"},{"name":"color_wheel","type":"object","desc":"Color wheel for degree lookups (null = window.BradyColorWheel).","default":"null"},{"name":"engine","type":"object","desc":"A BradySimilarity engine (BradySimilarity.createEngine(...)), one instance shared across the timeline. Required when `stimuli` is empty: it supplies the next trial and receives the response (engine.update) before the trial finishes. Ignored when `stimuli` is given. With item_shape \"line\", \"gabor\" or \"grating\" create it with { period: 180 }.","default":"null"},{"name":"adaptive","type":"boolean","desc":"Engine mode only: true = ask the engine for its next trial, epsilon-greedy: each trial is independently a uniform COVERAGE draw with probability epsilon (the engine's `epsilon`, default 0.2; a per-trial Bernoulli draw, so the coverage count varies), else the most-informative (BALD-selected) trial. false = always force a coverage draw.","default":"true"},{"name":"prompt","type":"HTML string","desc":"Question shown at the top of the box (defaults per layout if left null).","default":"null"},{"name":"item_size","type":"integer","desc":"Diameter/side (px) of each item.","default":"110"},{"name":"background_color","type":"string","desc":"Background color of the task box.","default":"\"#dddddd\""},{"name":"auto_zoom","type":"boolean","desc":"Scale the task box with CSS transform to fill the browser window.","default":"false"},{"name":"collect_confidence","type":"boolean","desc":"After the choice, show the inline 4-point word-confidence picker anchored to the chosen item (confidence is collected on every trial).","default":"true"},{"name":"confidence_labels","type":"string []","desc":"Word labels (low -> high) for the confidence picker.","default":"[\"Guess\",\"Maybe\",\"Probably\",\"Certain\"]"},{"name":"confidence_colors","type":"string []","desc":"CSS colors (low -> high) for the confidence buttons.","default":"[\"#e74c3c\",\"#e67e22\",\"#9acd32\",\"#2ecc71\"]"},{"name":"response_timeout","type":"integer","desc":"If > 0, end the trial with a null response after this many ms without a choice. A choice already waiting on its confidence rating is allowed to finish. 0 = wait forever.","default":"0"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from when the items appear to the (final) choice click. Null on timeout. The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the committing click. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable."},{"name":"layout","type":"string","desc":"The task layout used (\"reference\" or \"triangle\")."},{"name":"items","type":"string []","desc":"The item specs as displayed [top, bottom-left, bottom-right] (both layouts)."},{"name":"degrees","type":"integer []","desc":"The wheel/orientation degrees as displayed (integers in [0, period)), or nulls for non-degree items."},{"name":"period","type":"integer","desc":"Period (degrees) of the stimulus space that `degrees` and the offsets live in: 180 for item_shape \"line\", \"gabor\" or \"grating\" (they look the same rotated 180 degrees), 360 otherwise (BradyUtils.shapePeriod)."},{"name":"reference","type":"string","desc":"\"reference\" layout: the top reference item spec (and its degree in `degrees[0]`)."},{"name":"comparisons","type":"string []","desc":"\"reference\" layout: the two bottom comparison item specs [left, right]."},{"name":"item_offsets","type":"object","desc":"Signed wrapped offsets (each wrap(y-x) in (-period/2, period/2]); null unless all three degrees are known. \"reference\": { ab: leftComparison-reference, ac: rightComparison-reference }. \"triangle\": { ab, ac, bc } between the three displayed items."},{"name":"response","type":"integer","desc":"The chosen index. \"reference\": 0 = bottom-left, 1 = bottom-right (the item judged MOST DIFFERENT from the reference); the engine gets it as is (engine.update(\"reftriad\", spec, response), 0 = comparisons[0] more different). \"triangle\": 0..2 (display order) of the odd item. The engine's triad outcome is the most-similar pair, indexed 0 = AB, 1 = AC, 2 = BC over the displayed [A, B, C], so the engine gets 2 - odd (engine.update(\"triad\", spec, 2 - response)): odd 0 -> BC (2), 1 -> AC (1), 2 -> AB (0). Null on timeout (the engine is not updated)."},{"name":"chosen_pair","type":"integer []","desc":"\"triangle\" layout only: the remaining, most-similar pair ([i, j] display indices). Null otherwise/on timeout."},{"name":"confidence","type":"integer","desc":"Confidence rating 1..N, N = number of confidence_labels (default 4: 1 = Guess ... 4 = Certain). Null when not collected or on timeout."},{"name":"rt_confidence","type":"integer","desc":"Response time (ms) from the choice to the confidence rating (collect_confidence only; else null)."},{"name":"confidence_mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the confidence-rating click. Null when not collected or not measurable."},{"name":"is_coverage_trial","type":"boolean","desc":"Engine mode: true if this trial was a coverage draw (the per-trial probability-epsilon draw, or adaptive:false), false if BALD-selected. Null in fixed designs."},{"name":"model_score","type":"float","desc":"Engine mode: the BALD information score of the selected trial (null on coverage draws and in fixed designs)."},{"name":"stimuli_shown","type":"object []","desc":"One entry per displayed item, display order: kind plus value/src/text, and `degree` (in [0, period)) when the spec is a number. Gabor/grating items also carry `phase`, the grating phase (deg) the item was drawn with."},{"name":"color_wheel_name","type":"string","desc":"Name of the color wheel the trial used: the wheel's `name` (\"schurgin-brady-2020\" for the default wheel, or the name of a loaded alternative or `color_wheel`), or \"custom\" for a wheel without one. Records which wheel the recorded degrees refer to (BradyUtils.colorWheelName)."}]},{"file":"jspsych-similarity-quad.js","global":"jsPsychSimilarityQuad","name":"similarity-quad","desc":"Similarity quad (pair comparison): two pairs of items side by side. The participant clicks the pair that is MOST DIFFERENT, i.e. whose two items are least similar to each other.","params":[{"name":"stimuli","type":"string []","desc":"The 4 items as [pair1-top, pair1-bottom, pair2-top, pair2-bottom]; pair1 is shown on the left. Each may be a number (color-wheel degree, or orientation degree when `item_shape` is \"line\"/\"triangle\"/\"gabor\"/\"grating\"), a CSS color / \"lab(...)\" string, an image path, or text. Numbers are recorded wrapped into [0, period), so a \"line\" at 200 is recorded (and drawn) as 20. Leave empty to draw the quad from `engine` instead (adaptive mode).","default":"[]"},{"name":"item_type","type":"string","desc":"Force interpretation of items: \"auto\" (default), \"color\", \"image\", or \"text\".","default":"\"auto\""},{"name":"item_shape","type":"string","desc":"Item shape: \"disk\" (default; a numeric item is a color-wheel hue), or \"line\" / \"triangle\" / \"gabor\" / \"grating\" (a numeric item is an orientation in degrees; 0 = horizontal / pointing right, increasing clockwise). Lines and triangles are drawn in `item_color`; Gabors and gratings are achromatic, set by `grating_options`, with stripes at d running the same way as a \"line\" at d. \"line\", \"gabor\" and \"grating\" repeat every 180 degrees (period 180); \"disk\" and \"triangle\" repeat every 360.","default":"\"disk\""},{"name":"item_color","type":"string","desc":"Fill color for \"line\"/\"triangle\" (orientation/shape) items. Gabors and gratings are achromatic and ignore it.","default":"\"#555555\""},{"name":"grating_options","type":"object","desc":"Gabor/grating appearance (item_shape \"gabor\" or \"grating\"; ignored otherwise). An object; keys you leave out keep their defaults: cycles (4): grating cycles across the item diameter; contrast (1): Michelson contrast 0..1 around the mean, capped so the sinusoid is not clipped (around a light mean such as the default #dddddd background only ~0.15 fits; use background_color \"#808080\" for full contrast); sigma (0.18): Gaussian envelope SD as a fraction of the item diameter (gabor only); phase (0): cosine phase in degrees at the item centre (0 = a bright stripe through the centre), or \"random\" for an independent whole-degree phase per item (recorded in stimuli_shown); mean (\"background\"): the mean gray, \"background\" to match background_color's luminance so the patch blends into the box, or a CSS color (its luminance is used). Degree d and d + 180 draw the same pattern.","default":"{\"cycles\":4,\"contrast\":1,\"sigma\":0.18,\"phase\":0,\"mean\":\"background\"}"},{"name":"color_wheel","type":"object","desc":"Color wheel for degree lookups (null = window.BradyColorWheel).","default":"null"},{"name":"engine","type":"object","desc":"A BradySimilarity engine (BradySimilarity.createEngine(...)), one instance shared across the timeline. Required when `stimuli` is empty: it supplies the next quad (nextQuad) and receives the response (engine.update) before the trial finishes. Ignored when `stimuli` is given. With item_shape \"line\", \"gabor\" or \"grating\" create it with { period: 180 }.","default":"null"},{"name":"adaptive","type":"boolean","desc":"Engine mode only: true = ask the engine for its next quad, epsilon-greedy: each trial is independently a uniform COVERAGE draw with probability epsilon (the engine's `epsilon`, default 0.2; a per-trial Bernoulli draw, so the coverage count varies), else the most-informative (BALD-selected) quad. false = always force a coverage draw.","default":"true"},{"name":"prompt","type":"HTML string","desc":"Question shown at the top of the box.","default":"\"Which PAIR is most DIFFERENT? Click it.\""},{"name":"item_size","type":"integer","desc":"Diameter/side (px) of each item.","default":"110"},{"name":"background_color","type":"string","desc":"Background color of the task box.","default":"\"#dddddd\""},{"name":"auto_zoom","type":"boolean","desc":"Scale the task box with CSS transform to fill the browser window.","default":"false"},{"name":"collect_confidence","type":"boolean","desc":"After the choice, show the inline 4-point word-confidence picker anchored to the chosen pair (confidence is collected on every trial).","default":"true"},{"name":"confidence_labels","type":"string []","desc":"Word labels (low -> high) for the confidence picker.","default":"[\"Guess\",\"Maybe\",\"Probably\",\"Certain\"]"},{"name":"confidence_colors","type":"string []","desc":"CSS colors (low -> high) for the confidence buttons.","default":"[\"#e74c3c\",\"#e67e22\",\"#9acd32\",\"#2ecc71\"]"},{"name":"response_timeout","type":"integer","desc":"If > 0, end the trial with a null response after this many ms without a choice. A choice already waiting on its confidence rating is allowed to finish. 0 = wait forever.","default":"0"}],"data":[{"name":"rt","type":"integer","desc":"Response time (ms) from when the pairs appear to the (final) choice click. Null on timeout. The literature's \"response initiation time\"."},{"name":"mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the committing click. \"Response duration\" (RD) in Zhou et al. (PNAS, in press); tracks confidence independently of rt. null if not measurable."},{"name":"pair1","type":"string []","desc":"The left pair's 2 item specs as displayed [top, bottom]."},{"name":"pair2","type":"string []","desc":"The right pair's 2 item specs as displayed [top, bottom]."},{"name":"degrees","type":"integer []","desc":"The 4 wheel/orientation degrees as displayed [pair1-top, pair1-bottom, pair2-top, pair2-bottom] (integers in [0, period)), or nulls for non-degree items."},{"name":"period","type":"integer","desc":"Period (degrees) of the stimulus space that `degrees` and the offsets live in: 180 for item_shape \"line\", \"gabor\" or \"grating\" (they look the same rotated 180 degrees), 360 otherwise (BradyUtils.shapePeriod)."},{"name":"pair_offsets","type":"integer []","desc":"Signed wrapped within-pair offsets [wrap(p1b-p1a), wrap(p2b-p2a)] in (-period/2, period/2]; null unless all four degrees are known."},{"name":"response","type":"integer","desc":"Which pair was clicked as MOST DIFFERENT: 0 = left (pair1), 1 = right (pair2). Null on timeout. The engine's quad outcome is the more-similar pair, so engine.update gets 1 - response."},{"name":"chosen_pair_items","type":"string []","desc":"The chosen (most-different) pair's 2 item specs. Null on timeout."},{"name":"confidence","type":"integer","desc":"Confidence rating 1..N, N = number of confidence_labels (default 4: 1 = Guess ... 4 = Certain). Null when not collected or on timeout."},{"name":"rt_confidence","type":"integer","desc":"Response time (ms) from the choice to the confidence rating (collect_confidence only; else null)."},{"name":"confidence_mouse_hold_duration","type":"integer","desc":"How long (ms) the mouse button was held for the confid radySimilarity.createEngine(...)), one instance shared across the timeline. Required when `stimuli` is empty: it supplies the next pair (nextPair) and receives the rating (engine.update) before the trial finishes. Ignored when `stimuli` is given. With item_shape \"line\", \"gabor\" or \"grating\" create it with { period: 180 }.","default":"null"},{"name":"adaptive","type":"boolean","desc":"Engine mode only: true = ask the engine for its next pair, epsilon-greedy: each trial is independently a uniform COVERAGE draw with probability epsilon (the engine's `epsilon`, default 0.2; a per-trial Bernoulli draw, so the coverage count varies), else the most-informative (BALD-selected) pair. false = always force a coverage draw.","default":"true"},{"name":"prompt","type":"HTML string","desc":"Question shown at the top of the box.","default":"\"How similar are these two items?\""},{"name":"rating_points","type":"integer","desc":"Number of rating buttons R (rating 1..R; values below 2 become 2). In engine mode the engine's ratingPoints wins (with a warning) when they disagree.","default":"7"},{"name":"rating_labels","type":"string []","desc":"Word anchors: the first entry goes under the first button, the last entry under the last button; any middle entries are not shown.","default":"[\"Very different\",\"Very similar\"]"},{"name":"item_size","type":"integer","desc":"Diameter/side (px) of each item.","default":"110"},{"name":"background_color","type":"string","desc":"Background color of the task box.","default":"\"#dddddd\""},{"name":"auto_zoom","type":"boolean","desc":"Scale the task box with CSS transform to fill the browser window.","default":"false"},{"name":"collect_confidence","type":"boolean","desc":"After the rating, show the inline 4-point word-confidence picker anchored to the chosen button (confidence is collected on every trial).","default":"true"},{"name":"confidence_labels","type":"string []","desc":"Word labels (low -> high) for the confidence picker.","default":"[   function demoImage(){ const c=document.createElement("canvas"); c.width=c.height=110; const x=c.getContext("2d"); x.fillStyle="rgb(60,140,220)"; x.fillRect(0,0,110,110); x.fillStyle="rgb(230,170,40)"; x.beginPath(); x.arc(55,55,38,0,7); x.fill(); x.fillStyle="rgb(210,60,90)"; x.fillRect(20,20,28,28); return c.toDataURL(); }
  function demoSprite(n){ const c=document.createElement("canvas"); c.width=80*n; c.height=80; const x=c.getContext("2d"); for(let i=0;i<n;i++){ x.fillStyle="hsl("+(i*360/n)+",70%,55%)"; x.fillRect(i*80,0,80,80);} return c.toDataURL(); }

    "continuous-image-report": () => ({ type: jsPsychContinuousImageReport, image_sprite: SPRITE, num_frames: 12, set_size: 3, feedback: true }),
    "continuous-object-report": () => ({ type: jsPsychContinuousObjectReport, object_image: IMG, set_size: 3, feedback: true }),
    "color-rotated-object": () => ({ type: jsPsychColorRotatedObject, mode: "report", stimulus: IMG, color_rotation_deg: 90, feedback: true }),
    "wm-forced-choice": () => ({ type: jsPsychWmForcedChoice, set_size: 3, choices_per_test: 4, response_ui: "mouse", feedback: true }),
    "wm-pairs": () => ({ type: jsPsychWmPairs, set_size: 3, probe_feature: "inner", feedback: true }),
    "noise-dots": () => ({ type: jsPsychNoiseDots, colors: [40, 210], noise_level: 0.4, response_mode: "binary", feedback: true }),
    "recognition": () => ({ type: jsPsychRecognition, stimulus: "#3aa0dc", item_type: "color", is_old: true, response_mode: "confidence6", response_ui: "buttons", feedback: true }),
    "recall": () => ({ type: jsPsychRecall, stimuli: ["7","3","9","2"], item_type: "text", which_test: 0 }),
    "spatial-report": () => ({ type: jsPsychSpatialReport, set_size: 3, response_mode: "click", feedback: true }),
    "rsvp": () => ({ type: jsPsychRsvp, stimuli: [0,72,144,216,288], item_type: "color", item_duration: 300 }),
    "object-orientation-report": () => ({ type: jsPsychObjectOrientationReport, object_image: "stimuli/obj-clock.jpg", set_size: 3, background_color: "#ffffff", placeholder_border: "2px solid #cccccc", feedback: true }),
    "similarity-triad": () => ({ type: jsPsychSimilarityTriad, stimuli: [20, 60, 210], item_type: "color" }),
    "similarity-quad": () => ({ type: jsPsychSimilarityQuad, stimuli: [20, 40, 200, 300], item_type: "color" }),
    "similarity-likert": () => ({ type: jsPsychSimilarityLikert, stimuli: [40, 120], item_type: "color" }),
  };

  const esc = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const rows = (arr, withDefault) => arr.map((p) =>
    "<tr><td class='nm'>" + esc(p.name) + "</td><td class='ty'>" + esc(p.type) + "</td>" +
    (withDefault ? "<td class='df'>" + esc(p.default) + "</td>" : "") +
    "<td>" + esc(p.desc) + "</td></tr>").join("");

  const nav = document.getElementById("nav");
  // "All data fields": one searchable table of every data field across the plugins.
  const ALL_FIELDS = "all-data-fields";
  const allLink = document.createElement("a");
  allLink.textContent = "All data fields";
  allLink.id = "nav-all-fields";
  allLink.style.fontWeight = "700";
  allLink.onclick = () => showAllFields();
  nav.appendChild(allLink);
  PLUGINS.forEach((p, i) => {
    const a = document.createElement("a");
    a.textContent = p.name;
    a.onclick = () => show(i);
    a.dataset.i = i;
    nav.appendChild(a);
  });

  let jsp = null, cur = -1;
  function stopDemo() { if (jsp) { try { jsp.pluginAPI.clearAllTimeouts(); } catch (e) {} jsp = null; } }

  // Every data field of every plugin in one table, filtered by a search box that matches
  // the plugin name, field name, type or description (all words must match).
  function showAllFields() {
    stopDemo();
    cur = ALL_FIELDS;
    document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a === allLink));
    if (location.hash.slice(1) !== ALL_FIELDS) location.hash = ALL_FIELDS;
    const all = [];
    PLUGINS.forEach((p) => p.data.forEach((d) => all.push({ plugin: p.name, name: d.name, type: d.type, desc: d.desc })));
    document.getElementById("main").innerHTML =
      "<h2 class='plugname'>All data fields</h2>" +
      "<div class='desc'>Every field the plugins record, in one table. Type to filter by plugin, field, type or description " +
      "(e.g. <code>orientation</code>, <code>hold</code>, <code>wm-pairs</code>); every word must match.</div>" +
      "<input id='field-search' type='search' placeholder='Search data fields...' autocomplete='off' " +
      "style='width:100%;max-width:520px;font-size:16px;padding:6px 10px;margin:8px 0;box-sizing:border-box' />" +
      "<div id='field-count' style='color:#666;margin-bottom:6px'></div>" +
      "<table class='params' id='all-fields'><thead><tr><th>Plugin</th><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody>" +
      all.map((r) => "<tr data-s='" + esc((r.plugin + " " + r.name + " " + r.type + " " + r.desc).toLowerCase()).replace(/'/g, "&#39;") + "'>" +
        "<td>" + esc(r.plugin) + "</td><td class='nm'>" + esc(r.name) + "</td><td class='ty'>" + esc(r.type) + "</td><td>" + esc(r.desc) + "</td></tr>").join("") +
      "</tbody></table>";
    const box = document.getElementById("field-search"), count = document.getElementById("field-count");
    const trs = Array.from(document.querySelectorAll("#all-fields tbody tr"));
    const filter = () => {
      const words = box.value.toLowerCase().split(/\s+/).filter(Boolean);
      let n = 0;
      trs.forEach((tr) => { const s = tr.dataset.s; const ok = words.every((w) => s.indexOf(w) >= 0); tr.style.display = ok ? "" : "none"; if (ok) n++; });
      count.textContent = n + " of " + trs.length + " fields";
    };
    box.addEventListener("input", filter);
    filter();
  }

  function show(i) {
    const p = PLUGINS[i];
    cur = i;
    document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.i !== undefined && +a.dataset.i === i));
    location.hash = p.name;
    document.getElementById("main").innerHTML =
      "<h2 class='plugname'>" + esc(p.name) + "</h2><div class='global'>window." + esc(p.global) + " &nbsp;(&lt;script src=\"" + esc(p.file) + "\"&gt;)</div>" +
      "<div class='desc'>" + esc(p.desc) + "</div>" +
      "<button class='btn' id='run'>&#8635; Replay demo</button>" +
      "<div id='demo-area'><div id='demo-target'></div><div id='demo-results'></div></div>" +
      "<h3 class='sec'>Parameters</h3>" +
      "<table class='params'><thead><tr><th>Name</th><th>Type</th><th>Default</th><th>Description</th></tr></thead><tbody>" + rows(p.params, true) + "</tbody></table>" +
      "<h3 class='sec'>Data generated</h3>" +
      "<table class='params'><thead><tr><th>Name</th><th>Type</th><th>Description</th></tr></thead><tbody>" + rows(p.data, false) + "</tbody></table>";
    document.getElementById("run").onclick = () => runDemo(p.name);
    if (DEMO[p.name]) { try { runDemo(p.name); } catch (e) {} } // auto-run the demo when a plugin is shown
  }

  function runDemo(name) {
    if (!DEMO[name]) return;
    if (jsp) { try { jsp.pluginAPI.clearAllTimeouts(); } catch (e) {} } // stop the previous demo's timers before switching
    document.getElementById("demo-target").innerHTML = "";
    const results = document.getElementById("demo-results");
    results.style.display = "none"; results.textContent = "";
    jsp = jsPsychModule.initJsPsych({
      display_element: "demo-target",
      on_finish: () => {
        document.getElementById("demo-target").innerHTML =
          "<div style='min-height:60px;display:flex;align-items:center;justify-content:center;color:#999'>Trial complete - data below.</div>";
        const trunc = (k, v) => (typeof v === "string" && v.length > 80 ? v.slice(0, 60) + "...[" + v.length + " chars]" : v);
        results.style.display = "block";
        results.textContent = "Recorded data:\n" + JSON.stringify(jsp.data.get().values(), trunc, 2);
      },
    });
    jsp.run([DEMO[name]()]);
  }

  const hash0 = decodeURIComponent(location.hash.slice(1));
  if (hash0 === ALL_FIELDS) showAllFields();
  else show(Math.max(0, PLUGINS.findIndex((p) => p.name === hash0)));
  window.addEventListener("hashchange", () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === ALL_FIELDS) { if (cur !== ALL_FIELDS) showAllFields(); return; }
    const i = PLUGINS.findIndex((p) => p.name === h);
    if (i >= 0 && i !== cur) show(i);
  });
  </script>
  <script>
    (function () {
      var b = document.querySelector('.navToggle'); if (!b) return;
      b.addEventListener('click', function () {
        var o = document.body.classList.toggle('nav-open');
        b.setAttribute('aria-expanded', o ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
